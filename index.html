<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>多站工作进度台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --ink: #0F172A;
    --ink-2: #475569;
    --ink-3: #94A3B8;
    --line: #E2E8F0;
    --line-2: #F1F5F9;
    --brand: #0EA5E9;
    --brand-d: #0284C7;
    --brand-bg: #E0F2FE;
    --p0: #EF4444;   /* 紧急 红 */
    --p0-bg: #FEE2E2;
    --p1: #F59E0B;   /* 重要 橙 */
    --p1-bg: #FEF3C7;
    --p2: #3B82F6;   /* 一般 蓝 */
    --p2-bg: #DBEAFE;
    --ok: #10B981;
    --ok-bg: #D1FAE5;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --shadow-lg: 0 10px 25px -5px rgba(15,23,42,.08), 0 8px 10px -6px rgba(15,23,42,.05);
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }

  /* ===== 顶栏 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(8px);
    -webkit-backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--ink); }
  .brand-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), var(--brand-d)); display: grid; place-items: center; }
  .brand-logo svg { width: 18px; height: 18px; }
  .topbar-spacer { flex: 1; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 14px; border-radius: 8px;
    font-size: 14px; font-weight: 500; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .05s;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  }
  .btn:active { transform: scale(.97); }
  .btn:hover { background: var(--line-2); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-d); }
  .btn-danger { color: var(--p0); border-color: var(--p0-bg); }
  .btn-danger:hover { background: var(--p0-bg); }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 7px; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--line-2); }

  /* ===== 容器 ===== */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 20px 40px; }

  /* ===== 备份提示条 ===== */
  .backup-tip {
    display: none; align-items: center; gap: 10px;
    background: var(--p1-bg); color: #92400E; border: 1px solid #FDE68A;
    padding: 10px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 14px;
  }
  .backup-tip.show { display: flex; }
  .backup-tip svg { width: 18px; height: 18px; flex-shrink: 0; }
  .backup-tip button { margin-left: auto; }

  /* ===== 今日要处理 ===== */
  .today-box {
    background: linear-gradient(135deg, #fff 0%, #fff 60%, var(--brand-bg) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .today-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .today-head h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .today-head .date { color: var(--ink-3); font-size: 13px; font-weight: 500; }
  .today-count { margin-left: auto; display: flex; gap: 6px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .pill-over { background: var(--p0-bg); color: var(--p0); }
  .pill-today { background: var(--p1-bg); color: #92400E; }
  .pill-soon { background: var(--brand-bg); color: var(--brand-d); }
  .today-list { display: flex; flex-direction: column; gap: 8px; }
  .today-item {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px;
  }
  .today-item.over { border-color: var(--p0); background: #FFFBFB; }
  .today-item .pmark { width: 8px; height: 28px; border-radius: 4px; flex-shrink: 0; }
  .today-item .info { flex: 1; min-width: 0; }
  .today-item .t-title { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .today-item .t-meta { font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .today-item .t-meta .ws { color: var(--brand-d); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
  .today-item .due { font-weight: 600; font-size: 12px; }
  .due.over { color: var(--p0); }
  .due.today { color: #92400E; }
  .due.soon { color: var(--brand-d); }
  .today-empty { text-align: center; color: var(--ink-3); padding: 18px; font-size: 14px; }
  .today-empty svg { width: 40px; height: 40px; margin: 0 auto 8px; display: block; opacity: .5; }

  /* ===== 主Tab ===== */
  .maintabs { display: flex; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .maintab {
    flex: 1; height: 40px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .15s;
  }
  .maintab svg { width: 16px; height: 16px; }
  .maintab.active { background: var(--brand); color: #fff; }
  .maintab:not(.active):hover { background: var(--line-2); }
  .pane { display: none; }
  .pane.active { display: block; }

  /* ===== 网站工作区 ===== */
  .ws-tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  .ws-tabs::-webkit-scrollbar { height: 4px; }
  .ws-tabs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .ws-tab {
    display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
    border-radius: 10px; background: #fff; border: 1px solid var(--line);
    font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
    flex-shrink: 0;
  }
  .ws-tab .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .ws-tab .cnt { font-size: 11px; background: var(--line-2); color: var(--ink-3); padding: 1px 7px; border-radius: 999px; font-weight: 700; }
  .ws-tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .ws-tab.active .cnt { background: rgba(255,255,255,.18); color: #fff; }
  .ws-tab.add { border-style: dashed; color: var(--ink-3); }
  .ws-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .ws-head h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ws-head .domain { color: var(--ink-3); font-size: 13px; font-weight: 500; }
  .ws-head .ws-progress { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-weight: 600; }

  /* 任务卡片网格 */
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .task-card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
    transition: box-shadow .15s, transform .05s;
  }
  .task-card:hover { box-shadow: var(--shadow-lg); }
  .task-card.done { opacity: .65; }
  .tc-top { display: flex; align-items: flex-start; gap: 10px; }
  .tc-pmark { width: 4px; align-self: stretch; border-radius: 4px; flex-shrink: 0; min-height: 38px; }
  .tc-main { flex: 1; min-width: 0; }
  .tc-title { font-weight: 700; font-size: 15px; line-height: 1.4; word-break: break-word; }
  .tc-card.done .tc-title { text-decoration: line-through; color: var(--ink-3); }
  .tc-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
  .tag-p0 { background: var(--p0-bg); color: var(--p0); }
  .tag-p1 { background: var(--p1-bg); color: #92400E; }
  .tag-p2 { background: var(--p2-bg); color: #1E40AF; }
  .tag-due { background: var(--line-2); color: var(--ink-2); }
  .tag-due.over { background: var(--p0-bg); color: var(--p0); }
  .tag-due.today { background: var(--p1-bg); color: #92400E; }
  .tc-actions { display: flex; gap: 4px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); transition: all .12s; }
  .icon-btn:hover { background: var(--line-2); color: var(--ink); }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn.danger:hover { background: var(--p0-bg); color: var(--p0); }
  /* 批量选择 */
  .tc-sel { display: inline-flex; align-items: center; flex-shrink: 0; margin-right: 4px; }
  .tc-sel input { width: 18px; height: 18px; accent-color: var(--brand); cursor: pointer; margin: 0; }
  .task-card.sel { box-shadow: 0 0 0 2px var(--brand), var(--card-shadow); }
  /* 批量操作栏 */
  .batch-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 120;
    background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(15,23,42,.12);
    display: none; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .batch-bar.show { display: block; }
  .batch-bar .bb-inner { display: flex; align-items: center; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .bb-count { font-weight: 700; font-size: 14px; color: var(--brand-d); white-space: nowrap; }
  .bb-sep { width: 1px; height: 24px; background: var(--line); flex-shrink: 0; }
  .bb-group { display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
  .bb-group label { font-size: 12px; color: var(--ink-2); }
  .bb-group input[type=number] { width: 56px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font-size: 16px; }
  .bb-group input[type=date] { height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; font-size: 16px; }
  .bb-mini { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .bb-mini:hover { background: var(--line-2); }
  .bb-mini.p0 { color: var(--p0); border-color: var(--p0-bg); }
  .bb-mini.p1 { color: #92400E; border-color: var(--p1-bg); }
  .bb-mini.p2 { color: #1E40AF; border-color: var(--p2-bg); }
  .bb-mini.danger { color: var(--p0); border-color: var(--p0-bg); }
  .bb-mini.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .bb-select { height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; font-size: 13px; max-width: 140px; }

  /* 进度条 */
  .tc-progress { display: flex; align-items: center; gap: 8px; }
  .tc-progress .bar { flex: 1; height: 6px; background: var(--line-2); border-radius: 999px; overflow: hidden; }
  .tc-progress .fill { height: 100%; border-radius: 999px; transition: width .3s; }
  .tc-progress .num { font-size: 12px; font-weight: 700; color: var(--ink-2); min-width: 32px; text-align: right; }

  /* 步骤列表 */
  .steps { display: flex; flex-direction: column; gap: 4px; }
  .step {
    display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px;
    transition: background .1s; cursor: pointer; min-height: 40px;
  }
  .step:hover { background: var(--line-2); }
  .step-check {
    width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--ink-3);
    flex-shrink: 0; display: grid; place-items: center; transition: all .15s; background: #fff;
  }
  .step.done .step-check { background: var(--ok); border-color: var(--ok); }
  .step-check svg { width: 12px; height: 12px; color: #fff; opacity: 0; transition: opacity .1s; }
  .step.done .step-check svg { opacity: 1; }
  .step-name { flex: 1; font-size: 14px; line-height: 1.35; word-break: break-word; }
  .step.done .step-name { color: var(--ink-3); text-decoration: line-through; }
  .step-skip { font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--line-2); color: var(--ink-3); white-space: nowrap; }
  .step-del { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); opacity: 0; transition: opacity .1s; }
  .step:hover .step-del { opacity: 1; }
  .step-del:hover { background: var(--p0-bg); color: var(--p0); }
  .step-del svg { width: 13px; height: 13px; }
  .step-add {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin-top: 2px;
    border: 1px dashed var(--line); border-radius: 8px; color: var(--ink-3); font-size: 13px;
  }
  .step-add input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; min-width: 0; }
  .step-add input::placeholder { color: var(--ink-3); }
  .step-add button { font-size: 12px; font-weight: 600; color: var(--brand-d); padding: 4px 8px; border-radius: 6px; }
  .step-add button:hover { background: var(--brand-bg); }
  .step-add label { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-3); cursor: pointer; }
  .step-add label input { width: 13px; height: 13px; }

  /* ===== 优先级看板 ===== */
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .board-col { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
  .board-col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 0 4px; }
  .board-col-head .dot { width: 10px; height: 10px; border-radius: 3px; }
  .board-col-head h3 { font-size: 14px; font-weight: 700; }
  .board-col-head .cnt { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-3); background: var(--line-2); padding: 2px 8px; border-radius: 999px; }
  .board-list { display: flex; flex-direction: column; gap: 8px; }
  .mini-card {
    background: var(--line-2); border-radius: 9px; padding: 9px 11px; border-left: 3px solid;
    cursor: pointer; transition: background .12s;
  }
  .mini-card:hover { background: #E8EEF5; }
  .mini-card .mc-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; word-break: break-word; }
  .mini-card .mc-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .mini-card .mc-meta .ws { color: var(--brand-d); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
  .mini-card .mc-prog { margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .mini-card .mc-prog .bar { flex: 1; height: 4px; background: #fff; border-radius: 999px; overflow: hidden; }
  .mini-card .mc-prog .fill { height: 100%; border-radius: 999px; }
  .mini-card .mc-prog .num { font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .mini-card.done .mc-title { text-decoration: line-through; color: var(--ink-3); }

  /* ===== 近期工作 ===== */
  .upcoming { display: flex; flex-direction: column; gap: 10px; }
  .day-group { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .day-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--line-2); border-bottom: 1px solid var(--line); }
  .day-head .dnum { font-size: 18px; font-weight: 800; line-height: 1; }
  .day-head .dinfo { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
  .day-head .dinfo .dweek { color: var(--ink-3); font-weight: 500; }
  .day-head .dcnt { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-3); background: #fff; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .day-head.today { background: var(--brand-bg); }
  .day-head.today .dnum, .day-head.today .dinfo { color: var(--brand-d); }
  .day-body { padding: 6px; }
  .up-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; transition: background .1s; cursor: pointer; }
  .up-item:hover { background: var(--line-2); }
  .up-item .pmark { width: 4px; height: 26px; border-radius: 3px; flex-shrink: 0; }
  .up-item .u-title { flex: 1; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up-item .u-ws { font-size: 11px; color: var(--brand-d); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .up-item.done .u-title { text-decoration: line-through; color: var(--ink-3); }

  /* ===== 空状态 ===== */
  .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-3); }
  .empty-state svg { width: 56px; height: 56px; margin: 0 auto 12px; display: block; opacity: .4; }
  .empty-state h4 { font-size: 16px; color: var(--ink-2); margin-bottom: 6px; }
  .empty-state p { font-size: 13.5px; }

  /* ===== 模态框 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 16px;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .modal-mask.show { display: flex; }
  .sync-status{ padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;margin-bottom:14px; }
  .sync-status.idle{ background:var(--line-2);color:var(--ink-2); }
  .sync-status.ok{ background:#DCFCE7;color:#15803D; }
  .sync-status.doing{ background:#DBEAFE;color:#1D4ED8; }
  .sync-status.err{ background:#FEE2E2;color:#B91C1C; }
  .field .hint{ font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.55; }
  .field .hint.warn{ color:#B45309;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:8px 10px;margin-top:8px; }
  .req{ color:#EF4444; }
  .modal {
    background: #fff; border-radius: 16px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); animation: pop .18s ease;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-head { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
  .modal-head h3 { font-size: 16px; font-weight: 700; }
  .modal-head .close { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); }
  .modal-head .close:hover { background: var(--line-2); color: var(--ink); }
  .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .field input, .field select, .field textarea {
    height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; outline: none; background: #fff;
    transition: border-color .12s, box-shadow .12s; width: 100%;
  }
  .field textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 70px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .seg { display: flex; gap: 6px; }
  .seg-opt {
    flex: 1; height: 40px; border-radius: 9px; border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .12s; background: #fff;
  }
  .seg-opt .d { width: 9px; height: 9px; border-radius: 3px; }
  .seg-opt.active { border-width: 2px; }
  .seg-opt[data-p="P0"].active { border-color: var(--p0); background: var(--p0-bg); color: var(--p0); }
  .seg-opt[data-p="P1"].active { border-color: var(--p1); background: var(--p1-bg); color: #92400E; }
  .seg-opt[data-p="P2"].active { border-color: var(--p2); background: var(--p2-bg); color: #1E40AF; }
  .modal-foot { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .modal-foot .btn { flex: 1; justify-content: center; height: 42px; }

  /* 确认弹窗 */
  .confirm-modal { max-width: 380px; }
  #confirmModal { z-index: 150; }  /* 确认框必须高于其他弹窗，否则会被模板库等盖住 */
  .confirm-modal .modal-body { text-align: center; padding: 24px 20px 8px; }
  .confirm-modal .icon-wrap { width: 52px; height: 52px; border-radius: 50%; background: var(--p0-bg); display: grid; place-items: center; margin: 0 auto 12px; }
  .confirm-modal .icon-wrap svg { width: 26px; height: 26px; color: var(--p0); }
  .confirm-modal h4 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .confirm-modal p { font-size: 14px; color: var(--ink-2); line-height: 1.5; }

  /* ===== Toast ===== */
  .toast-wrap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,.2); display: flex; align-items: center; gap: 8px;
    animation: toastIn .25s ease;
  }
  @keyframes toastIn { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .toast svg { width: 16px; height: 16px; }
  .toast.ok svg { color: var(--ok); }
  .toast.err svg { color: var(--p0); }

  /* ===== 移动端 ===== */
  @media (max-width: 768px) {
    body { font-size: 14.5px; }
    .topbar { padding: 10px 12px; gap: 8px; }
    .brand { font-size: 15px; }
    .brand-logo { width: 28px; height: 28px; }
    .btn { height: 34px; padding: 0 11px; font-size: 13px; }
    .btn .label { display: none; }
    .btn-primary .label, .btn-danger .label { display: inline; }
    .wrap { padding: 12px 12px 90px; }
    .today-box { padding: 14px 14px; border-radius: 12px; }
    .today-head h2 { font-size: 15px; }
    .maintabs { padding: 3px; }
    .maintab { height: 36px; font-size: 13px; }
    .maintab .label { display: none; }
    .maintab.active .label { display: inline; }
    .task-grid { grid-template-columns: 1fr; gap: 10px; }
    .task-card { padding: 12px; border-radius: 12px; }
    .board { grid-template-columns: 1fr; gap: 10px; }
    .field-row { grid-template-columns: 1fr; }
    .ws-tab { height: 36px; font-size: 13px; padding: 0 11px; }
    .modal { max-width: 100%; border-radius: 14px; align-self: center; max-height: 85vh; }
    .modal-mask { align-items: center; padding: 12px; }
    @keyframes pop { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  }
  /* 底部导航(移动端) */
  .bottomnav { display: none; }
  @media (max-width: 768px) {
    .bottomnav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;

    }
    .bottomnav button.active { color: var(--brand); }
    .bottomnav button svg { width: 20px; height: 20px; }
  }
</style>

<script>
/* =========================================================
   多站工作进度台  —— 单文件，localStorage 持久化
   key 前缀: wb_multisite_
========================================================= */
const PREFIX = 'wb_multisite_';
const K_WEBSITES = PREFIX + 'websites';
const K_TASKS = PREFIX + 'tasks';
const K_TEMPLATES = PREFIX + 'templates';
const K_SAMPLE = PREFIX + 'sample_loaded';
const SAMPLE_VERSION = 'v2'; // 改了示例网站命名后递增
const TPL_VERSION = 'v4';
const K_ACTIVE_WS = PREFIX + 'active_ws';
const K_SYNC = PREFIX + 'sync_cfg';
const K_SYNC_META = PREFIX + 'sync_meta';

const WS_COLORS = ['#0EA5E9','#3B82F6','#8B5CF6','#EC4899','#F43F5E','#F59E0B','#10B981','#14B8A6','#6366F1','#64748B'];
const PCOLOR = { P0:'#EF4444', P1:'#F59E0B', P2:'#3B82F6' };
const PNAME = { P0:'紧急', P1:'重要', P2:'一般' };

/* ---------- 工具 ---------- */
const $ = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => [...p.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayStr = () => { const d=new Date(); return fmt(d); };
const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return fmt(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
function relDue(dueStr) {
  if(!dueStr) return {label:'', cls:''};
  const n = daysBetween(todayStr(), dueStr);
  if(n < 0) return {label:'已逾期'+(-n)+'天', cls:'over'};
  if(n===0) return {label:'今天到期', cls:'today'};
  if(n===1) return {label:'明天到期', cls:'soon'};
  if(n<=3) return {label:n+'天后到期', cls:'soon'};
  return {label:n+'天后', cls:''};
}
function load(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function shiftDate(str, n) {
  const [y,m,d] = str.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const dd = String(dt.getDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}
function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); if(!suppressSync && (k===K_WEBSITES||k===K_TASKS||k===K_TEMPLATES)) schedulePush(); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 示例数据 ---------- */
function seedSampleData() {
  const loadedVer = localStorage.getItem(K_SAMPLE);
  if(loadedVer === SAMPLE_VERSION) return false;
  // 检测到旧版本示例，强制重新加载
  localStorage.removeItem(PREFIX + 'websites');
  localStorage.removeItem(PREFIX + 'tasks');
  localStorage.removeItem(K_ACTIVE_WS);
  const t = todayStr();
  const websites = [
    { id: uid(), name:'服装出口站', domain:'apparel-export.com', color:'#0EA5E9' },
    { id: uid(), name:'家居饰品站', domain:'home-decor.cn', color:'#8B5CF6' },
    { id: uid(), name:'技术博客', domain:'techblog.io', color:'#10B981' },
    { id: uid(), name:'新品落地页', domain:'promo-page.net', color:'#F59E0B' },
    { id: uid(), name:'主题测试站', domain:'staging.local', color:'#64748B' },
  ];
  const [w1,w2,w3,w4,w5] = websites;
  const tasks = [

/* ---------- 渲染：今日要处理 ---------- */
function renderToday() {
  const t = todayStr();
  const items = tasks.filter(x => {
    if(x.due && allDone(x)) return false; // 完成的不显示
    if(!x.due) return false;
    const n = daysBetween(t, x.due);
    return n <= 3; // 逾期+今天+近3天
  }).sort((a,b) => {
    // 逾期优先，再按优先级，再按日期
    const ao = daysBetween(t,a.due)<0?0:1, bo = daysBetween(t,b.due)<0?0:1;
    if(ao!==bo) return ao-bo;
    const pr = {P0:0,P1:1,P2:2};
    if(pr[a.priority]!==pr[b.priority]) return pr[a.priority]-pr[b.priority];
    return a.due.localeCompare(b.due);
  });

  const over = items.filter(x=>daysBetween(t,x.due)<0).length;
  const todayN = items.filter(x=>daysBetween(t,x.due)===0).length;
  const soon = items.filter(x=>daysBetween(t,x.due)>0).length;

  const wsMap = {}; websites.forEach(w=>wsMap[w.id]=w);
  let html = `
    <div class="today-head">
      <h2>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--brand-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        今天要处理
      </h2>
      <span class="date">${formatChineseDate(t)}</span>
      <span class="today-count">
        ${over?`<span class="pill pill-over">逾期 ${over}</span>`:''}
        ${todayN?`<span class="pill pill-today">今日 ${todayN}</span>`:''}
        ${soon?`<span class="pill pill-soon">近3天 ${soon}</span>`:''}
      </span>
    </div>`;

  if(!items.length) {
    html += `<div class="today-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      棒！近期没有逾期或紧急的工作，可以去看看全部工作内容。
    </div>`;
  } else {
    html += '<div class="today-list">';
    items.forEach(x => {
      const ws = wsMap[x.websiteId];
      const r = relDue(x.due);
      const prog = taskProgress(x);
      html += `
        <div class="today-item ${r.cls==='over'?'over':''}" data-task="${x.id}">
          <div class="pmark" style="background:${PCOLOR[x.priority]}"></div>
          <div class="info">
            <div class="t-title">${escapeHtml(x.title)}</div>
            <div class="t-meta">
              <span class="ws">${ws?escapeHtml(ws.domain||ws.name):'未分类'}</span>
              <span>${prog.done}/${prog.total} 步</span>
            </div>
          </div>
          <span class="due ${r.cls}">${r.label}</span>
          <button class="btn btn-sm btn-primary" data-quick="${x.id}">处理</button>
        </div>`;
    });
    html += '</div>';
  }
  $('#todayBox').innerHTML = html;
}

function renderTaskGrid() {
  const w = websites.find(x=>x.id===activeWs);
  if(!w) { $('#taskGrid').innerHTML = emptyState('网站','还没有网站，点右上角「新建网站」开始'); return; }
  let wsTasks = tasks.filter(t=>t.websiteId===w.id);
  // 排序：未完成在前，按优先级再按截止日期
  const pr = {P0:0,P1:1,P2:2};
  wsTasks.sort((a,b)=>{
    const ad=allDone(a)?1:0, bd=allDone(b)?1:0;
    if(ad!==bd) return ad-bd;
    if(pr[a.priority]!==pr[b.priority]) return pr[a.priority]-pr[b.priority];
    return (a.due||'9999').localeCompare(b.due||'9999');
  });
  if(!wsTasks.length) {
    $('#taskGrid').innerHTML = emptyState('工作', '这个网站还没有工作内容，点右上角「新建工作」添加');
    return;
  }
  $('#taskGrid').innerHTML = wsTasks.map(renderTaskCard).join('');
  bindStepEvents();
}

      <div class="tc-top">
        <label class="tc-sel" title="选择此任务">

            <span class="tag tag-${x.priority.toLowerCase()}">${x.priority} ${PNAME[x.priority]}</span>
            ${x.due?`<span class="tag tag-due ${r.cls}">${formatShort(x.due)} · ${r.label}</span>`:'<span class="tag tag-due">无截止</span>'}

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>

          </button>
          <button class="icon-btn danger" data-del="${x.id}" title="删除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>

      ${x.note?`<div style="font-size:13px;color:var(--ink-2);background:var(--line-2);padding:8px 10px;border-radius:8px;line-height:1.4">${escapeHtml(x.note)}</div>`:''}

  if(!selectedTasks.size) return;
  let c = 0;
  tasks.forEach(t => { if(selectedTasks.has(t.id)) { t.priority = p; c++; } });
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已将 '+c+' 项优先级设为 '+p, 'ok');
}
function batchShiftDue(n) {
  if(!selectedTasks.size) return;
  const t = todayStr();
  let c = 0;
  tasks.forEach(x => {
    if(!selectedTasks.has(x.id)) return;
    if(x.due) { x.due = shiftDate(x.due, n); }
    else { x.due = shiftDate(t, n); }
    c++;
  });
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已顺延 '+n+' 天（'+c+' 项）', 'ok');
}
function batchSetDate(dateStr) {
  if(!selectedTasks.size || !dateStr) return;
  let c = 0;
  tasks.forEach(x => { if(selectedTasks.has(x.id)) { x.due = dateStr; c++; } });
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已设日期 '+dateStr+'（'+c+' 项）', 'ok');
}
function batchMoveWebsite(wid) {
  if(!selectedTasks.size || !wid) return;
  let c = 0;
  tasks.forEach(x => { if(selectedTasks.has(x.id)) { x.websiteId = wid; c++; } });
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已移动 '+c+' 项到 '+ (websites.find(w=>w.id===wid)?.domain||'网站'), 'ok');
}
function batchDeleteSelected() {
  if(!selectedTasks.size) return;
  const n = selectedTasks.size;
  showConfirm('删除选中的 '+n+' 项工作？', '这 '+n+' 项工作及其所有步骤将被永久删除，此操作不可恢复。', () => {
    tasks = tasks.filter(t => !selectedTasks.has(t.id));
    save(K_TASKS, tasks);
    clearSelection(); renderAll();
    toast('已删除 '+n+' 项工作','ok');
  });
}

/* ---------- 渲染：优先级看板 ---------- */
function renderBoard() {
  const wsMap = {}; websites.forEach(w=>wsMap[w.id]=w);
  const cols = { P0:[], P1:[], P2:[] };
  tasks.forEach(t => { if(!allDone(t)) cols[t.priority]?.push(t); });
  const pr = {P0:0,P1:1,P2:2};
  Object.values(cols).forEach(arr => arr.sort((a,b)=>{
    if(pr[a.priority]!==pr[b.priority]) return pr[a.priority]-pr[b.priority];
    return (a.due||'9999').localeCompare(b.due||'9999');
  }));
  $('#board').innerHTML = ['P0','P1','P2'].map(p => `
    <div class="board-col">
      <div class="board-col-head">
        <span class="dot" style="background:${PCOLOR[p]}"></span>
        <h3>${p} ${PNAME[p]}</h3>
        <span class="cnt">${cols[p].length}</span>
      </div>
      <div class="board-list">
        ${cols[p].length ? cols[p].map(t=>miniCard(t,wsMap)).join('') : '<div style="text-align:center;color:var(--ink-3);font-size:13px;padding:20px 0">暂无</div>'}
      </div>
    </div>`).join('');
}
function miniCard(t, wsMap){
  const ws = wsMap[t.websiteId];
  const prog = taskProgress(t);
  const r = relDue(t.due);
  return `<div class="mini-card ${allDone(t)?'done':''}" style="border-color:${PCOLOR[t.priority]}" data-edit="${t.id}">
    <div class="mc-title">${escapeHtml(t.title)}</div>
    <div class="mc-meta">
      <span class="ws">${ws?escapeHtml(ws.domain||ws.name):'未分类'}</span>
      ${t.due?`<span class="${r.cls}" style="font-weight:600;color:${r.cls==='over'?'var(--p0)':r.cls==='today'?'#92400E':'var(--brand-d)'}">${r.label}</span>`:''}
    </div>
    <div class="mc-prog">
      <div class="bar"><div class="fill" style="width:${prog.pct}%;background:${PCOLOR[t.priority]}"></div></div>
      <span class="num">${prog.done}/${prog.total}</span>
    </div>
  </div>`;
}

/* ---------- 渲染：近期工作 ---------- */
function renderUpcoming() {
  const wsMap = {}; websites.forEach(w=>wsMap[w.id]=w);
  const t = todayStr();
  // 未来7天有截止的 + 已逾期的未完成，按日分组
  const upcoming = tasks.filter(x => x.due && !allDone(x) && daysBetween(t,x.due)<=7).sort((a,b)=>a.due.localeCompare(b.due));
  const groups = {};
  upcoming.forEach(x => { (groups[x.due] = groups[x.due]||[]).push(x); });
  // 也展示逾期单独一组(放到最前)
  const overdue = tasks.filter(x => x.due && !allDone(x) && daysBetween(t,x.due)<0).sort((a,b)=>a.due.localeCompare(b.due));

  if(!upcoming.length && !overdue.length) {
    $('#upcoming').innerHTML = emptyState('近期', '未来7天没有安排工作，去新建一个吧');
    return;
  }
  let html = '';
  if(overdue.length) {
    html += `<div class="day-group">
      <div class="day-head" style="background:var(--p0-bg)">
        <div class="dnum" style="color:var(--p0)">!</div>
        <div class="dinfo" style="color:var(--p0)"><div>已逾期 · 需尽快处理</div><div class="dweek">${overdue.length} 项工作超出截止日期</div></div>
        <span class="dcnt" style="background:var(--p0);color:#fff;border-color:var(--p0)">${overdue.length}</span>
      </div>
      <div class="day-body">
        ${overdue.map(x=>upItem(x,wsMap)).join('')}
      </div>
    </div>`;
  }
  // 未来7天逐日
  for(let i=0;i<=7;i++){
    const d = addDays(t,i);
    if(!groups[d]) continue;
    const date = parse(d);
    const week = ['日','一','二','三','四','五','六'][date.getDay()];
    html += `<div class="day-group">
      <div class="day-head ${i===0?'today':''}">
        <div class="dnum">${date.getDate()}</div>
        <div class="dinfo">
          <div>${i===0?'今天':i===1?'明天':formatChineseDate(d)}</div>
          <div class="dweek">周${week} · ${groups[d].length} 项</div>
        </div>
        <span class="dcnt">${groups[d].length}</span>
      </div>
      <div class="day-body">${groups[d].map(x=>upItem(x,wsMap)).join('')}</div>
    </div>`;
  }
  $('#upcoming').innerHTML = html;
}
function upItem(x, wsMap){
  const ws = wsMap[x.websiteId];
  const prog = taskProgress(x);
  return `<div class="up-item ${allDone(x)?'done':''}" data-edit="${x.id}">
    <div class="pmark" style="background:${PCOLOR[x.priority]}"></div>
    <div class="u-title">${escapeHtml(x.title)}</div>
    <span class="u-ws">${ws?escapeHtml(ws.domain||ws.name):''}</span>
    <span style="font-size:11.5px;color:var(--ink-3);font-weight:600">${prog.done}/${prog.total}</span>
  </div>`;
}

/* ---------- 辅助 ---------- */
function taskProgress(x){
  const total = x.steps.length;
  const done = x.steps.filter(s=>s.done).length;
  return { done, total, pct: total?Math.round(done/total*100):0 };
}
function allDone(x){ const p=taskProgress(x); return p.total>0 && p.done===p.total; }
function formatChineseDate(s){
  const d=parse(s); return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function formatShort(s){
  const d=parse(s); return (d.getMonth()+1)+'/'+d.getDate();
}
function emptyState(icon, msg){
  const icons = {
    '网站': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    '工作': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    '近期': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  };
  return `<div class="empty-state">${icons[icon]||icons['工作']}<h4>暂无内容</h4><p>${msg}</p></div>`;
}

/* ---------- 事件绑定 ---------- */
function bindStepEvents(){
  // 步骤勾选
  $$('.step[data-step]').forEach(el => {
    el.addEventListener('click', e => {
      if(e.target.closest('[data-del-step]')) return;
      const sid = el.dataset.step, tid = el.dataset.task;
      const t = tasks.find(x=>x.id===tid);
      if(!t) return;
      const s = t.steps.find(y=>y.id===sid);
      if(!s) return;
      s.done = !s.done;
      save(K_TASKS, tasks);
      // 局部更新这张卡片
      const card = el.closest('.task-card');
      const x = tasks.find(y=>y.id===tid);
      const prog = taskProgress(x);
      card.classList.toggle('done', allDone(x));
      card.querySelector('.tc-progress .fill').style.width = prog.pct+'%';
      card.querySelector('.tc-progress .fill').style.background = allDone(x)?'var(--ok)':PCOLOR[x.priority];
      card.querySelector('.tc-progress .num').textContent = prog.done+'/'+prog.total;
      el.classList.toggle('done', s.done);
      renderToday(); renderBoard(); renderUpcoming(); renderWsTabs(); renderWsHead();
    });
  });
  // 删除步骤
  $$('[data-del-step]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const sid = el.dataset.delStep, tid = el.dataset.delTask;
      const t = tasks.find(x=>x.id===tid);
      if(!t) return;
      t.steps = t.steps.filter(s=>s.id!==sid);
      save(K_TASKS, tasks);
      renderAll();
      toast('已删除步骤','ok');
    });
  });
  // 添加步骤
  $$('.step-add').forEach(el => {
    const inp = el.querySelector('input[type=text]');
    const chk = el.querySelector('input[type=checkbox]');
    const btn = el.querySelector('button');
    const tid = el.dataset.addFor;
    const doAdd = () => {
      const v = inp.value.trim();
      if(!v) return;
      const t = tasks.find(x=>x.id===tid);
      if(!t) return;
      t.steps.push({ id:uid(), name:v, done:false, skippable:chk.checked });
      save(K_TASKS, tasks);
      renderAll();
      inp.value=''; chk.checked=false;
    };
    btn.addEventListener('click', doAdd);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
  });
}

/* ---------- 任务模态 ---------- */
function openTaskModal(id){
  editingTaskId = id;
  // 填充网站下拉
  $('#fWebsite').innerHTML = websites.map(w=>`<option value="${w.id}">${escapeHtml(w.name)}${w.domain?' ('+escapeHtml(w.domain)+')':''}</option>`).join('')
    || '<option value="">请先新建网站</option>';
  // 填充模板下拉
  $('#fTemplate').innerHTML = '<option value="">— 不使用模板，手动填写 —</option>'
    + templates.map(tp=>`<option value="${tp.id}">${escapeHtml(tp.name)} (${tp.steps.length}步)</option>`).join('');
  $('#fTemplate').value = '';
  if(id){
    const t = tasks.find(x=>x.id===id);
    $('#taskModalTitle').textContent = '编辑工作内容';
    $('#fWebsite').value = t.websiteId;
    $('#fTitle').value = t.title;
    $$('#fPriority .seg-opt').forEach(b=>b.classList.toggle('active', b.dataset.p===t.priority));
    $('#fDue').value = t.due || '';
    $('#fSteps').value = t.steps.map(s => s.name + (s.skippable?'（可跳过）':'')).join('\n');
    $('#fNote').value = t.note || '';
  } else {
    $('#taskModalTitle').textContent = '新建工作内容';
    $('#fTitle').value=''; $('#fDue').value=''; $('#fSteps').value=''; $('#fNote').value='';
    $$('#fPriority .seg-opt').forEach(b=>b.classList.toggle('active', b.dataset.p==='P1'));
    if(activeWs) $('#fWebsite').value = activeWs;
  }
  $('#taskModal').classList.add('show');
}
// 模板填充
$('#fTemplate').addEventListener('change', e => {
  const id = e.target.value;
  if(!id) return;
  const tp = templates.find(x=>x.id===id);
  if(!tp) return;
  $('#fTitle').value = tp.title;
  $$('#fPriority .seg-opt').forEach(b=>b.classList.toggle('active', b.dataset.p===tp.priority));
  $('#fSteps').value = tp.steps.map(s => s.name + (s.skippable?'（可跳过）':'')).join('\n');
  toast('已填充模板「'+tp.name+'」，可再编辑','ok');
});
function saveTask(){
  if(!websites.length){ toast('请先新建网站','err'); return; }
  const websiteId = $('#fWebsite').value;
  const title = $('#fTitle').value.trim();
  if(!title){ toast('请填写工作标题','err'); return; }
  const priority = $('#fPriority .seg-opt.active').dataset.p;
  const due = $('#fDue').value || '';
  const note = $('#fNote').value.trim();
  // 解析步骤：每行一个，末尾"（可跳过）"或"(可跳过)"标记
  const steps = $('#fSteps').value.split('\n').map(s=>s.trim()).filter(Boolean).map(line => {
    let skippable = false; let name = line;
    const m = line.match(/[（(]\s*可跳过\s*[）)]\s*$/);
    if(m){ skippable = true; name = line.slice(0, m.index).trim(); }
    return { id:uid(), name, done:false, skippable };
  });
  if(editingTaskId){
    const t = tasks.find(x=>x.id===editingTaskId);
    // 保留已存在步骤的done状态（按名称匹配）
    const oldMap = {}; t.steps.forEach(s=>oldMap[s.name]=s);
    const newSteps = steps.map(s => {
      const old = oldMap[s.name];
      if(old) return { ...s, id:old.id, done:old.done };
      return s;
    });
    // 已删除的步骤不再保留
    t.websiteId = websiteId; t.title=title; t.priority=priority; t.due=due; t.note=note; t.steps=newSteps;
    toast('已更新','ok');
  } else {
    tasks.push({ id:uid(), websiteId, title, priority, due, steps, note, createdAt:todayStr() });
    toast('已新建','ok');
  }
  save(K_TASKS, tasks);
  activeWs = websiteId; save(K_ACTIVE_WS, activeWs);
  closeAllModals();
  renderAll();
}
function confirmDelTask(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  showConfirm('删除工作内容？', `「${t.title}」及其所有步骤将被删除，此操作不可恢复。`, () => {
    tasks = tasks.filter(x=>x.id!==id);
    selectedTasks.delete(id);
    save(K_TASKS, tasks);
    renderAll();
    toast('已删除','ok');
  });
}

$('#tplSaveBtn').addEventListener('click', () => {
  const name = $('#tplName').value.trim();
  if(!name){ toast('请填写模板名称','err'); return; }
  if(!savingTplFromTask){ toast('未找到来源工作','err'); return; }
  const t = tasks.find(x=>x.id===savingTplFromTask);
  if(!t){ toast('未找到来源工作','err'); return; }
  const tpl = {
    id: uid(),
    name,
    title: t.title,
    priority: t.priority,
    steps: t.steps.map(s => ({ id:uid(), name:s.name, skippable:s.skippable }))
  };
  templates.push(tpl);
  save(K_TEMPLATES, templates);
  closeAllModals();
  savingTplFromTask = null;
  toast('已存为模板「'+name+'」','ok');
});

        <textarea data-tpl-steps="${tp.id}" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;min-height:80px;resize:vertical;background:#fff;font-family:inherit">${escapeHtml(tp.steps.map(s=>s.name+(s.skippable?'（可跳过）':'')).join('\n'))}</textarea>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <span style="font-size:12px;color:var(--ink-3);width:50px">优先级</span>
        <select data-tpl-prio="${tp.id}" style="height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:13px;background:#fff">
          <option value="P0" ${tp.priority==='P0'?'selected':''}>P0 紧急</option>
          <option value="P1" ${tp.priority==='P1'?'selected':''}>P1 重要</option>
          <option value="P2" ${tp.priority==='P2'?'selected':''}>P2 一般</option>
        </select>
        <button class="btn btn-sm btn-primary" data-tpl-save="${tp.id}" style="margin-left:auto">保存修改</button>
      </div>
    </div>`).join('');
  // 绑定事件
  $$('[data-tpl-del]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.tplDel;
    const tp = templates.find(x=>x.id===id);
    showConfirm('删除模板？', `模板「${tp?tp.name:''}」将被删除，已使用该模板创建的工作不受影响。`, () => {
      templates = templates.filter(x=>x.id!==id);
      save(K_TEMPLATES, templates);
      renderTplLib();
      toast('已删除模板','ok');
    });
  }));
  $$('[data-tpl-save]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.tplSave;
    const tp = templates.find(x=>x.id===id);
    if(!tp) return;
    const name = $(`[data-tpl-name="${id}"]`).value.trim();
    const title = $(`[data-tpl-title="${id}"]`).value.trim();
    const stepsRaw = $(`[data-tpl-steps="${id}"]`).value;
    const prio = $(`[data-tpl-prio="${id}"]`).value;
    if(!name){ toast('模板名称不能为空','err'); return; }
    tp.name = name; tp.title = title || name; tp.priority = prio;
    tp.steps = stepsRaw.split('\n').map(s=>s.trim()).filter(Boolean).map(line => {
      let skippable=false, nm=line;
      const m = line.match(/[（(]\s*可跳过\s*[）)]\s*$/);
      if(m){ skippable=true; nm=line.slice(0,m.index).trim(); }
      return { id:uid(), name:nm, skippable };
    });
    save(K_TEMPLATES, templates);
    renderTplLib();
    toast('模板已更新','ok');
  }));
}

let confirmCb = null;

  $('#confirmText').textContent = text;

/* ---------- 导出/导入 ---------- */
function exportData(){
  const data = { version:1, exportedAt:new Date().toISOString(), websites, tasks, templates };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '多站工作进度_备份_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 '+websites.length+' 网站 / '+tasks.length+' 工作 / '+templates.length+' 模板','ok');
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if(!data.websites || !data.tasks) throw new Error('格式不对');
      const tplN = (data.templates||[]).length;
      showConfirm('确认导入？', `将覆盖当前数据（${websites.length}网站/${tasks.length}工作/${templates.length}模板），导入 ${data.websites.length} 网站 / ${data.tasks.length} 工作 / ${tplN} 模板。建议先导出当前备份。`, () => {
        websites = data.websites; tasks = data.tasks;
        templates = data.templates || [];
        save(K_WEBSITES, websites); save(K_TASKS, tasks); save(K_TEMPLATES, templates);
        activeWs = websites[0]?.id || null; save(K_ACTIVE_WS, activeWs);
        localStorage.setItem(K_SAMPLE, SAMPLE_VERSION);
        localStorage.setItem(PREFIX + 'tpl_version', TPL_VERSION);
        renderAll();
        toast('导入成功','ok');
      });
    } catch(err){ toast('导入失败：'+err.message,'err'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------- GitHub 云端同步 ---------- */
function b64encodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decodeUtf8(b64){ return decodeURIComponent(escape(atob(b64.replace(/\s/g,'')))); }

function syncApiUrl(){
  return 'https://api.github.com/repos/'+encodeURIComponent(syncCfg.owner)+'/'+encodeURIComponent(syncCfg.repo)+'/contents/'+encodeURIComponent(syncCfg.path);
}
function ghHeaders(extra){
  return Object.assign({ 'Authorization':'Bearer '+syncCfg.token, 'Accept':'application/vnd.github+json' }, extra||{});
}
function updateSyncStatus(state, msg){
  syncMeta.status = state; syncMeta.msg = msg||'';
  if(state==='ok') syncMeta.lastSync = Date.now();
  save(K_SYNC_META, syncMeta);
  const el = $('#syncStatus');
  if(!el) return;
  const map = {
    idle:  ['idle','未配置 / 已断开'],
    doing: ['doing','同步中…'],
    ok:    ['ok','已连接 · 上次同步 '+(syncMeta.lastSync?new Date(syncMeta.lastSync).toLocaleString('zh-CN'):'—')],
    err:   ['err','同步失败：'+(syncMeta.msg||'未知错误')]
  };
  const [cls,txt] = map[state] || map.idle;
  el.className = 'sync-status '+cls;
  el.textContent = txt;
}

async function githubPull(){
  if(!syncCfg || !syncCfg.token) return null;
  const res = await fetch(syncApiUrl(), { headers: ghHeaders() });
  if(res.status === 404) return null; // 远程还没有数据文件
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.message || ('HTTP '+res.status)); }
  const j = await res.json();
  const data = JSON.parse(b64decodeUtf8(j.content));
  data.__sha = j.sha;
  return data;
}

function setRemoteSha(sha){
  remoteSha = sha || null;
  save(K_SYNC_SHA, remoteSha);
}

async function githubPush(){
  if(!syncCfg || !syncCfg.token) return;
  if(syncPushTimer) return; // 已在排队

  // 防御：如果 memory/localStorage 都没 sha（比如首次、或被清），先 pull 一次拿
  if(!remoteSha){
    try {
      const data = await githubPull();
      if(data) applyRemote(data);
    } catch(_){ /* pull 失败也照试 push，让 GitHub 报错 */ }
  }

  const payload = { version:2, exportedAt:new Date().toISOString(), websites, tasks, templates };
  const body = { message:'sync: '+new Date().toISOString(), content: b64encodeUtf8(JSON.stringify(payload)) };
  if(remoteSha) body.sha = remoteSha;
  const res = await fetch(syncApiUrl(), { method:'PUT', headers: ghHeaders({'Content-Type':'application/json'}), body: JSON.stringify(body) });
  if(!res.ok){
    if(res.status===409) throw new Error('CONFLICT');
    if(res.status===422 && remoteSha){
      // sha 失效（被外部改了），清掉再重试一次
      try{ const e = await res.json(); if((e.errors||[]).some(x=>/sha/i.test(x.message||''))) throw new Error('SHA_INVALID'); }catch(_){ throw new Error('HTTP 422'); }
    }
    const e = await res.json().catch(()=>({})); throw new Error(e.message || ('HTTP '+res.status));
  }
  const j = await res.json();
  remoteSha = j.content.sha;
  save(K_SYNC_SHA, remoteSha);
}

function schedulePush(){
  if(!syncCfg || !syncCfg.token) return;
  if(syncPushTimer) clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(async () => {
    syncPushTimer = null;
    try { updateSyncStatus('doing'); await githubPush(); updateSyncStatus('ok'); }
    catch(err){
      if(err.message==='CONFLICT'){ updateSyncStatus('err','远程已被改动'); toast('云端有更新，请点「立即拉取」','err'); }
      else { updateSyncStatus('err', err.message); toast('自动同步失败：'+err.message,'err'); }
    }
  }, 2500);
}

function applyRemote(data){
  if(!data) return;
  suppressSync = true;
  if(Array.isArray(data.websites)){ websites = data.websites; save(K_WEBSITES, websites); }
  if(Array.isArray(data.tasks)){ tasks = data.tasks; save(K_TASKS, tasks); }
  if(Array.isArray(data.templates)){ templates = data.templates; save(K_TEMPLATES, templates); }
  suppressSync = false;
  if(data.__sha) setRemoteSha(data.__sha);
  if(!activeWs || !websites.find(w=>w.id===activeWs)) activeWs = websites[0]?.id || null;
  save(K_ACTIVE_WS, activeWs);
  renderAll();
}

async function doPull(showToast){
  if(!syncCfg || !syncCfg.token){ toast('请先配置同步','err'); return; }
  try {
    updateSyncStatus('doing');
    const data = await githubPull();
    if(!data){ updateSyncStatus('ok'); if(showToast) toast('云端暂无数据，将以本地为准','ok'); return; }
    applyRemote(data);
    updateSyncStatus('ok');
    if(showToast) toast('已从云端拉取最新数据','ok');
  } catch(err){
    updateSyncStatus('err', err.message);
    toast('拉取失败：'+err.message,'err');
  }
}

function openSyncModal(){
  $('#syncOwner').value = syncCfg?.owner || '';
  $('#syncRepo').value = syncCfg?.repo || '';
  $('#syncPath').value = syncCfg?.path || 'data.json';
  $('#syncToken').value = syncCfg?.token || '';
  updateSyncStatus(syncMeta.status || 'idle', syncMeta.msg);
  $('#syncModal').classList.add('show');
}

function saveSyncCfg(){
  const owner = $('#syncOwner').value.trim();
  const repo = $('#syncRepo').value.trim();
  const path = ($('#syncPath').value.trim()) || 'data.json';
  const token = $('#syncToken').value.trim();
  if(!owner || !repo || !token){ toast('用户名/仓库名/Token 都必须填','err'); return; }
  syncCfg = { owner, repo, path, token };
  save(K_SYNC, syncCfg);
  setRemoteSha(null);
  toast('配置已保存，正在同步…','ok');
  (async () => {
    try {
      updateSyncStatus('doing');
      const data = await githubPull();
      if(data) applyRemote(data);
      await githubPush();
      updateSyncStatus('ok');
      toast('同步成功','ok');
      closeAllModals();
    } catch(err){
      if(err.message==='CONFLICT'){ updateSyncStatus('err','远程已被改动'); toast('云端有更新，请点「立即拉取」','err'); }
      else { updateSyncStatus('err', err.message); toast('同步失败：'+err.message,'err'); }
    }
  })();
}

function disconnectSync(){
  showConfirm('断开云端同步？', '将清除本设备保存的 GitHub 配置（token 会从本设备删除）。云端仓库里的数据文件不会删除。', () => {
    syncCfg = null; save(K_SYNC, null); setRemoteSha(null);
    updateSyncStatus('idle');
    toast('已断开同步','ok');
  });
}

function initAutoSync(){
  if(syncCfg && syncCfg.token){
    // 后台静默拉取：失败也不要阻断渲染
    doPull(false).catch(()=>{});
  }
}

/* ---------- 备份提示 ---------- */
function checkBackupTip(){
  const el = $('#backupTip');
  if(tasks.length >= 30){
    el.classList.add('show');
    $('#backupTipText').textContent = `数据已积累 ${tasks.length} 项工作，建议导出备份以防丢失。`;
  } else {
    el.classList.remove('show');
  }
}
$('#backupTipBtn').addEventListener('click', exportData);

/* ---------- Toast ---------- */
function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = 'toast '+type;
  const icon = type==='ok'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  el.innerHTML = icon + '<span>'+escapeHtml(msg)+'</span>';
  $('#toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateY(-8px)'; setTimeout(()=>el.remove(),250); }, 2200);
}

/* ---------- 启动 ---------- */
suppressSync = true;
seedSampleData();
seedTemplates();
templates = load(K_TEMPLATES, []);
suppressSync = false;
// 如果activeWs失效，重置
if(!activeWs || !websites.find(w=>w.id===activeWs)){ activeWs = websites[0]?.id || null; }
bindTabs();
// 任何渲染异常都不让页面全空
try { renderAll(); } catch(err){ console.error('renderAll failed:', err); }
// 关键修复：本地空数据且已配云端 → 先 await 拉一次再渲染（否则刷新后空白）
(async () => {
  if(syncCfg && syncCfg.token){
    if(websites.length === 0 && tasks.length === 0){
      // 本地空 → 必须等 doPull 完成才能正确渲染
      await doPull(false);
    } else {
      // 本地有数据 → 静默拉取做增量合并（不 await，避免阻塞渲染）
      doPull(false).catch(()=>{});
    }
  }
})();
</script>
