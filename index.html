<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>多站工作进度台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --ink: #0F172A;
    --ink-2: #475569;
    --ink-3: #94A3B8;
    --line: #E2E8F0;
    --line-2: #F1F5F9;
    --brand: #0EA5E9;
    --brand-d: #0284C7;
    --brand-bg: #E0F2FE;
    --p0: #EF4444;   /* 紧急 红 */
    --p0-bg: #FEE2E2;
    --p1: #F59E0B;   /* 重要 橙 */
    --p1-bg: #FEF3C7;
    --p2: #3B82F6;   /* 一般 蓝 */
    --p2-bg: #DBEAFE;
    --ok: #10B981;
    --ok-bg: #D1FAE5;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --shadow-lg: 0 10px 25px -5px rgba(15,23,42,.08), 0 8px 10px -6px rgba(15,23,42,.05);
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }

  /* ===== 顶栏 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(8px);
    -webkit-backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--ink); }
  .brand-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), var(--brand-d)); display: grid; place-items: center; }
  .brand-logo svg { width: 18px; height: 18px; }
  .topbar-spacer { flex: 1; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 14px; border-radius: 8px;
    font-size: 14px; font-weight: 500; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .05s;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  }
  .btn:active { transform: scale(.97); }
  .btn:hover { background: var(--line-2); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-d); }
  .btn-danger { color: var(--p0); border-color: var(--p0-bg); }
  .btn-danger:hover { background: var(--p0-bg); }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 7px; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--line-2); }

  /* ===== 容器 ===== */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 20px 40px; }

  /* ===== 备份提示条 ===== */
  .backup-tip {
    display: none; align-items: center; gap: 10px;
    background: var(--p1-bg); color: #92400E; border: 1px solid #FDE68A;
    padding: 10px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 14px;
  }
  .backup-tip.show { display: flex; }
  .backup-tip svg { width: 18px; height: 18px; flex-shrink: 0; }
  .backup-tip button { margin-left: auto; }

  /* ===== 今日要处理 ===== */
  .today-box {
    background: linear-gradient(135deg, #fff 0%, #fff 60%, var(--brand-bg) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .today-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .today-head h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .today-head .date { color: var(--ink-3); font-size: 13px; font-weight: 500; }
  .today-count { margin-left: auto; display: flex; gap: 6px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .pill-over { background: var(--p0-bg); color: var(--p0); }
  .pill-today { background: var(--p1-bg); color: #92400E; }
  .pill-soon { background: var(--brand-bg); color: var(--brand-d); }
  .today-list { display: flex; flex-direction: column; gap: 8px; }
  .today-item {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px;
  }
  .today-item.over { border-color: var(--p0); background: #FFFBFB; }
  .today-item .pmark { width: 8px; height: 28px; border-radius: 4px; flex-shrink: 0; }
  .today-item .info { flex: 1; min-width: 0; }
  .today-item .t-title { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .today-item .t-meta { font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .today-item .t-meta .ws { color: var(--brand-d); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
  .today-item .due { font-weight: 600; font-size: 12px; }
  .due.over { color: var(--p0); }
  .due.today { color: #92400E; }
  .due.soon { color: var(--brand-d); }
  .today-empty { text-align: center; color: var(--ink-3); padding: 18px; font-size: 14px; }
  .today-empty svg { width: 40px; height: 40px; margin: 0 auto 8px; display: block; opacity: .5; }
  /* 步骤勾选按钮 */
  .today-item .t-step-check { width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--line-2); background: #fff; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; color: transparent; transition: all .12s; }
  .today-item .t-step-check:hover { border-color: var(--brand); }
  .today-item .t-step-check.checked { background: var(--ok); border-color: var(--ok); color: #fff; }
  .today-item .t-step-check svg { width: 14px; height: 14px; }
  .today-item .t-step-name { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .today-item .t-task-title { color: var(--ink-2); }
  .today-item .src-tag { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
  .today-item .src-tag.task { background: #FEF3C7; color: #92400E; }
  .today-item .src-tag.step { background: #DBEAFE; color: #1D4ED8; }
  .today-item .icon-btn { width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
  .today-item .icon-btn:hover { background: var(--line-2); color: var(--ink); }
  .today-item .icon-btn svg { width: 15px; height: 15px; }

  /* ===== 主Tab ===== */
  .maintabs { display: flex; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .show-done-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; padding: 6px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line); user-select: none; transition: all .12s; }
  .show-done-toggle:hover { background: var(--line-2); }
  .show-done-toggle input { accent-color: var(--brand); cursor: pointer; margin: 0; }
  .maintab {
    flex: 1; height: 40px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .15s;
  }
  .maintab svg { width: 16px; height: 16px; }
  .maintab.active { background: var(--brand); color: #fff; }
  .maintab:not(.active):hover { background: var(--line-2); }
  .pane { display: none; }
  .pane.active { display: block; }

  /* ===== 网站工作区 ===== */
  .ws-tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  .ws-tabs::-webkit-scrollbar { height: 4px; }
  .ws-tabs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .ws-tab {
    display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
    border-radius: 10px; background: #fff; border: 1px solid var(--line);
    font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
    flex-shrink: 0;
  }
  .ws-tab .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .ws-tab .cnt { font-size: 11px; background: var(--line-2); color: var(--ink-3); padding: 1px 7px; border-radius: 999px; font-weight: 700; }
  .ws-tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .ws-tab.active .cnt { background: rgba(255,255,255,.22); color: #fff; }
  .ws-tab.add { border-style: dashed; color: var(--ink-3); }
  .ws-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .ws-head h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ws-head .domain { color: var(--ink-3); font-size: 13px; font-weight: 500; }
  .ws-head .ws-progress { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-weight: 600; }

  /* 任务卡片网格 */
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .task-card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
    transition: box-shadow .15s, transform .05s;
    position: relative;
  }
  .task-card:hover { box-shadow: var(--shadow-lg); }
  .task-card.done { opacity: .65; }
  .task-card.done .tc-title { text-decoration: line-through; color: var(--ink-3); }
  .task-card .tc-restore { display: none; }
  body.show-done-on .task-card.done { opacity: 1; border-style: dashed; border-color: var(--ok); background: linear-gradient(135deg, #fff 0%, #fff 60%, #ECFDF5 100%); }
  body.show-done-on .task-card.done .tc-title { text-decoration: none; color: var(--ink); }
  body.show-done-on .task-card.done .tc-del { display: none; }
  body.show-done-on .task-card.done .tc-restore { display: grid; }
  /* 批量选择模式：卡片可点切换 */
  body.batch-mode .task-card { cursor: pointer; }
  body.batch-mode .task-card:hover { box-shadow: 0 0 0 1px var(--brand); }
  .tc-select { color: var(--ink-3); }
  .tc-select:hover { color: var(--brand); }
  .task-card.sel .tc-select { color: var(--brand); background: var(--brand-bg); }
  .task-card.sel { box-shadow: 0 0 0 2px var(--brand), var(--shadow-lg); background: linear-gradient(135deg, #fff 0%, #fff 40%, var(--brand-bg) 100%); border-color: var(--brand); }
  .tc-top { display: flex; align-items: flex-start; gap: 10px; }
  .tc-pmark { width: 4px; align-self: stretch; border-radius: 4px; flex-shrink: 0; min-height: 38px; }
  .tc-main { flex: 1; min-width: 0; }
  .tc-title { font-weight: 700; font-size: 15px; line-height: 1.4; word-break: break-word; }
  .tc-card.done .tc-title { text-decoration: line-through; color: var(--ink-3); }
  .tc-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
  .tag-p0 { background: var(--p0-bg); color: var(--p0); }
  .tag-p1 { background: var(--p1-bg); color: #92400E; }
  .tag-p2 { background: var(--p2-bg); color: #1E40AF; }
  .tag-due { background: var(--line-2); color: var(--ink-2); }
  .tag-due.over { background: var(--p0-bg); color: var(--p0); }
  .tag-due.today { background: var(--p1-bg); color: #92400E; }
  .tc-actions { display: flex; gap: 4px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); transition: all .12s; }
  .icon-btn:hover { background: var(--line-2); color: var(--ink); }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn.danger:hover { background: var(--p0-bg); color: var(--p0); }
  /* 批量选择 */
  .tc-sel { display: inline-flex; align-items: center; flex-shrink: 0; margin-right: 4px; }
  .tc-sel input { width: 18px; height: 18px; accent-color: var(--brand); cursor: pointer; margin: 0; }
  .task-card.sel { box-shadow: 0 0 0 2px var(--brand), var(--card-shadow); }
  /* 批量操作栏 */
  .batch-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 120;
    background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(15,23,42,.12);
    display: none; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .batch-bar.show { display: block; }
  .batch-bar .bb-row { display: flex; align-items: center; gap: 8px; }
  .batch-bar .bb-actions { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 8px; margin-top: 4px; border-top: 0.5px dashed var(--line); }
  .bb-act { font-size: 13px; font-weight: 500; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: all .12s; }
  .bb-act:hover { border-color: var(--brand); color: var(--brand); }
  .bb-act.active { background: var(--brand-bg); border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .bb-panel { background: var(--brand-bg); border: 1px solid #B5D4F4; border-radius: 8px; padding: 10px; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bb-panel[hidden] { display: none; }
  .bb-panel label { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .bb-panel input[type=number] { width: 56px; height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; font-size: 15px; background: #fff; }
  .bb-panel input[type=date] { height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 6px; font-size: 14px; background: #fff; }
  .bb-panel select { height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 6px; font-size: 13px; background: #fff; max-width: 160px; }
  .bb-panel .bb-div { width: 1px; height: 24px; background: #B5D4F4; margin: 0 4px; }
  .bb-count { font-weight: 700; font-size: 14px; color: var(--brand-d); white-space: nowrap; }
  .bb-mini { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .bb-mini:hover { background: var(--line-2); }
  .bb-mini.p0 { color: var(--p0); border-color: var(--p0-bg); }
  .bb-mini.p1 { color: #92400E; border-color: var(--p1-bg); }
  .bb-mini.p2 { color: #1E40AF; border-color: var(--p2-bg); }
  .bb-mini.danger { color: var(--p0); border-color: var(--p0-bg); }
  .bb-mini.primary { background: var(--brand); color: #fff; border-color: var(--brand); }

  /* 进度条 */
  .tc-progress { display: flex; align-items: center; gap: 8px; }
  .tc-progress .bar { flex: 1; height: 6px; background: var(--line-2); border-radius: 999px; overflow: hidden; }
  .tc-progress .fill { height: 100%; border-radius: 999px; transition: width .3s; }
  .tc-progress .num { font-size: 12px; font-weight: 700; color: var(--ink-2); min-width: 32px; text-align: right; }

  /* 步骤列表 */
  .steps { display: flex; flex-direction: column; gap: 4px; }
  .step {
    display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px;
    transition: background .1s; cursor: pointer; min-height: 40px;
  }
  .step:hover { background: var(--line-2); }
  .step-check {
    width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--ink-3);
    flex-shrink: 0; display: grid; place-items: center; transition: all .15s; background: #fff;
  }
  .step.done .step-check { background: var(--ok); border-color: var(--ok); }
  .step-check svg { width: 12px; height: 12px; color: #fff; opacity: 0; transition: opacity .1s; }
  .step.done .step-check svg { opacity: 1; }
  .step-name { flex: 1; font-size: 14px; line-height: 1.35; word-break: break-word; }
  .step.done .step-name { color: var(--ink-3); text-decoration: line-through; }
  .step-skip { font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--line-2); color: var(--ink-3); white-space: nowrap; }
  .step-due { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: #DBEAFE; color: #1D4ED8; white-space: nowrap; font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .step-del { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); opacity: 0; transition: opacity .1s; }
  .step:hover .step-del { opacity: 1; }
  .step-del:hover { background: var(--p0-bg); color: var(--p0); }
  .step-del svg { width: 13px; height: 13px; }
  .step-add {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin-top: 2px;
    border: 1px dashed var(--line); border-radius: 8px; color: var(--ink-3); font-size: 13px;
  }
  .step-add input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; min-width: 0; }
  .step-add input::placeholder { color: var(--ink-3); }
  .step-add button { font-size: 12px; font-weight: 600; color: var(--brand-d); padding: 4px 8px; border-radius: 6px; }
  .step-add button:hover { background: var(--brand-bg); }
  .step-add label { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-3); cursor: pointer; }
  .step-add label input { width: 13px; height: 13px; }

  /* ===== 优先级看板 ===== */
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .board-col { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
  .board-col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 0 4px; }
  .board-col-head .dot { width: 10px; height: 10px; border-radius: 3px; }
  .board-col-head h3 { font-size: 14px; font-weight: 700; }
  .board-col-head .cnt { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-3); background: var(--line-2); padding: 2px 8px; border-radius: 999px; }
  .board-list { display: flex; flex-direction: column; gap: 8px; }
  .mini-card {
    background: var(--line-2); border-radius: 9px; padding: 9px 11px; border-left: 3px solid;
    cursor: pointer; transition: background .12s;
  }
  .mini-card:hover { background: #E8EEF5; }
  .mini-card .mc-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; word-break: break-word; }
  .mini-card .mc-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .mini-card .mc-meta .ws { color: var(--brand-d); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
  .mini-card .mc-prog { margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .mini-card .mc-prog .bar { flex: 1; height: 4px; background: #fff; border-radius: 999px; overflow: hidden; }
  .mini-card .mc-prog .fill { height: 100%; border-radius: 999px; }
  .mini-card .mc-prog .num { font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .mini-card.done .mc-title { text-decoration: line-through; color: var(--ink-3); }

  /* ===== 近期工作 ===== */
  .upcoming { display: flex; flex-direction: column; gap: 10px; }
  .day-group { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .day-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--line-2); border-bottom: 1px solid var(--line); }
  .day-head .dnum { font-size: 18px; font-weight: 800; line-height: 1; }
  .day-head .dinfo { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
  .day-head .dinfo .dweek { color: var(--ink-3); font-weight: 500; }
  .day-head .dcnt { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-3); background: #fff; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .day-head.today { background: var(--brand-bg); }
  .day-head.today .dnum, .day-head.today .dinfo { color: var(--brand-d); }
  .day-body { padding: 6px; }
  .up-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; transition: background .1s; cursor: default; }
  .up-item:hover { background: var(--line-2); }
  .up-item .pmark { width: 4px; height: 26px; border-radius: 3px; flex-shrink: 0; }
  /* 近期工作：任务+步骤 */
  .up-task { padding: 8px 10px; border-radius: 8px; }
  .up-task:not(:last-child) { border-bottom: 1px solid var(--line); }
  .up-task-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .up-task-head .pmark { width: 4px; height: 20px; border-radius: 3px; flex-shrink: 0; }
  .up-task-title { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up-ws { font-size: 11px; color: var(--brand-d); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .up-task-steps { display: flex; flex-direction: column; gap: 2px; padding-left: 12px; }
  .up-step { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; transition: background .1s; }
  .up-step:hover { background: var(--line-2); }
  .up-step-check { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: transparent; flex-shrink: 0; transition: all .12s; background: #fff; }
  .up-step-check.checked { background: var(--ok); border-color: var(--ok); color: #fff; }
  .up-step-check svg { width: 12px; height: 12px; }
  .up-step-name { font-size: 13.5px; flex: 1; }
  .up-step.done .up-step-name { text-decoration: line-through; color: var(--ink-3); }
  .step-skip { font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--line-2); color: var(--ink-3); white-space: nowrap; }
  /* 今天要处理：任务行+折叠步骤 */
  .today-task { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; margin-bottom: 6px; flex-wrap: wrap; transition: border-color .12s; }
  .today-task.over { border-color: var(--p0); background: #FFFBFB; }
  .today-task:hover { border-color: var(--brand); }
  .tt-row { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; min-width: 0; }
  .tt-expand { font-size: 11px; color: var(--ink-3); flex-shrink: 0; width: 14px; text-align: center; transition: transform .15s; }
  .today-task.expanded .tt-expand { transform: rotate(90deg); }
  .tt-row .pmark { width: 4px; height: 24px; border-radius: 3px; flex-shrink: 0; }
  .tt-title { font-weight: 600; font-size: 14.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tt-meta { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; white-space: nowrap; }
  .tt-meta .ws { color: var(--brand-d); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
  .today-task .icon-btn { width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
  .today-task .icon-btn:hover { background: var(--line-2); color: var(--ink); }
  .today-task .icon-btn svg { width: 15px; height: 15px; }
  .tt-steps { width: 100%; display: flex; flex-direction: column; gap: 1px; padding: 10px 4px 4px 36px; margin-top: 6px; border-top: 1px dashed var(--line); }
  .tt-steps[hidden] { display: none; }
  .tt-step { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer; transition: background .1s; font-size: 13.5px; color: var(--ink); order: 0; }
  .tt-step.done { order: 99; }
  .tt-step:hover { background: var(--line-2); }
  .tt-step .step-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: transparent; flex-shrink: 0; transition: all .12s; background: #fff; }
  .tt-step .step-check.checked { background: var(--ok); border-color: var(--ok); color: #fff; }
  .tt-step .step-check svg { width: 11px; height: 11px; }
  .tt-step .step-name { flex: 1; }
  .tt-step.done .step-name { text-decoration: line-through; color: var(--ink-3); }
  .tt-step .step-skip { font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--line-2); color: var(--ink-3); white-space: nowrap; }
  .tt-step .step-due { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: #DBEAFE; color: #1D4ED8; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ===== 空状态 ===== */
  .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-3); }
  .empty-state svg { width: 56px; height: 56px; margin: 0 auto 12px; display: block; opacity: .4; }
  .empty-state h4 { font-size: 16px; color: var(--ink-2); margin-bottom: 6px; }
  .empty-state p { font-size: 13.5px; }
  /* empty-state 在 grid 容器里要跨整列居中 */
  .task-grid > .empty-state, .board > .empty-state, .upcoming > .empty-state { grid-column: 1 / -1; }

  /* ===== 模态框 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 16px;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .modal-mask.show { display: flex; }
  .sync-status{ padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;margin-bottom:14px; }
  .sync-status.idle{ background:var(--line-2);color:var(--ink-2); }
  .sync-status.ok{ background:#DCFCE7;color:#15803D; }
  .sync-status.doing{ background:#DBEAFE;color:#1D4ED8; }
  .sync-status.err{ background:#FEE2E2;color:#B91C1C; }
  .field .hint{ font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.55; }
  .field .hint.warn{ color:#B45309;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:8px 10px;margin-top:8px; }
  .req{ color:#EF4444; }
  .modal {
    background: #fff; border-radius: 16px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); animation: pop .18s ease;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-head { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
  .modal-head h3 { font-size: 16px; font-weight: 700; }
  .modal-head .close { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); }
  .modal-head .close:hover { background: var(--line-2); color: var(--ink); }
  .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .field input, .field select, .field textarea {
    height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; outline: none; background: #fff;
    transition: border-color .12s, box-shadow .12s; width: 100%;
  }
  .field textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 70px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .seg { display: flex; gap: 6px; }
  .seg-opt {
    flex: 1; height: 40px; border-radius: 9px; border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .12s; background: #fff;
  }
  .seg-opt .d { width: 9px; height: 9px; border-radius: 3px; }
  .seg-opt.active { border-width: 2px; }
  .seg-opt[data-p="P0"].active { border-color: var(--p0); background: var(--p0-bg); color: var(--p0); }
  .seg-opt[data-p="P1"].active { border-color: var(--p1); background: var(--p1-bg); color: #92400E; }
  .seg-opt[data-p="P2"].active { border-color: var(--p2); background: var(--p2-bg); color: #1E40AF; }
  .modal-foot { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .modal-foot .btn { flex: 1; justify-content: center; height: 42px; }

  /* 确认弹窗 */
  .confirm-modal { max-width: 380px; }
  #confirmModal { z-index: 150; }  /* 确认框必须高于其他弹窗，否则会被模板库等盖住 */
  .confirm-modal .modal-body { text-align: center; padding: 24px 20px 8px; }
  .confirm-modal .icon-wrap { width: 52px; height: 52px; border-radius: 50%; background: var(--p0-bg); display: grid; place-items: center; margin: 0 auto 12px; }
  .confirm-modal .icon-wrap svg { width: 26px; height: 26px; color: var(--p0); }
  .confirm-modal h4 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .confirm-modal p { font-size: 14px; color: var(--ink-2); line-height: 1.5; }

  /* ===== Toast ===== */
  .toast-wrap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,.2); display: flex; align-items: center; gap: 8px;
    animation: toastIn .25s ease;
  }
  @keyframes toastIn { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .toast svg { width: 16px; height: 16px; }
  .toast.ok svg { color: var(--ok); }
  .toast.err svg { color: var(--p0); }

  /* ===== 移动端 ===== */
  @media (max-width: 768px) {
    body { font-size: 14.5px; }
    .topbar { padding: 10px 12px; gap: 8px; }
    .brand { font-size: 15px; }
    .brand-logo { width: 28px; height: 28px; }
    .btn { height: 34px; padding: 0 11px; font-size: 13px; }
    .btn .label { display: none; }
    .btn-primary .label, .btn-danger .label { display: inline; }
    .wrap { padding: 12px 12px 90px; }
    .today-box { padding: 14px 14px; border-radius: 12px; }
    .today-head h2 { font-size: 15px; }
    .maintabs { padding: 3px; }
    .maintab { height: 36px; font-size: 13px; }
    .maintab .label { display: none; }
    .maintab.active .label { display: inline; }
    .task-grid { grid-template-columns: 1fr; gap: 10px; }
    .task-card { padding: 12px; border-radius: 12px; }
    .board { grid-template-columns: 1fr; gap: 10px; }
    .field-row { grid-template-columns: 1fr; }
    .ws-tab { height: 36px; font-size: 13px; padding: 0 11px; }
    .modal { max-width: 100%; border-radius: 14px; align-self: center; max-height: 85vh; }
    .modal-mask { align-items: center; padding: 12px; }
    @keyframes pop { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  }
  /* 底部导航(移动端) */
  .bottomnav { display: none; }
  @media (max-width: 768px) {
    .bottomnav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      background: rgba(255,255,255,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .bottomnav button {
      flex: 1; height: 50px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 10.5px; font-weight: 600; color: var(--ink-3);
    }
    .bottomnav button.active { color: var(--brand); }
    .bottomnav button svg { width: 20px; height: 20px; }
  }
</style>
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </div>
    <span>多站工作进度台</span>
  </div>
  <div class="topbar-spacer"></div>
  <div class="top-actions">
    <button class="btn" id="btnSync">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 17 16M21 14l-3 3-3-3"/></svg>
      <span class="label">云端同步</span>
    </button>
    <button class="btn" id="btnTplLib">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span class="label">模板库</span>
    </button>
    <button class="btn" id="btnExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span class="label">导出备份</span>
    </button>
    <button class="btn" id="btnImport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <span class="label">导入恢复</span>
    </button>
    <button class="btn btn-primary" id="btnNewTask">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">新建工作</span>
    </button>
  </div>
</header>

<div class="wrap">

  <!-- 备份提示 -->
  <div class="backup-tip" id="backupTip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    <span id="backupTipText"></span>
    <button class="btn btn-sm" id="backupTipBtn">导出备份</button>
  </div>

  <!-- 今日要处理 -->
  <section class="today-box" id="todayBox"></section>

  <!-- 主Tab -->
  <div class="maintabs-wrap" style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <div class="maintabs" style="flex:1">
      <button class="maintab active" data-pane="sites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="label">网站工作区</span>
    </button>
    <button class="maintab" data-pane="board">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>
      <span class="label">优先级看板</span>
    </button>
    <button class="maintab" data-pane="upcoming">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span class="label">近期工作</span>
    </button>
    </div>
    <label class="show-done-toggle" title="显示已完成的任务">
      <input type="checkbox" id="showDone">
      <span>显示已完成</span>
    </label>
  </div>

  <!-- 网站工作区 -->
  <section class="pane active" id="pane-sites">
    <div class="ws-tabs" id="wsTabs"></div>
    <div class="ws-head" id="wsHead"></div>
    <div class="task-grid" id="taskGrid"></div>
  </section>

  <!-- 优先级看板 -->
  <section class="pane" id="pane-board">
    <div class="board" id="board"></div>
  </section>

  <!-- 近期工作 -->
  <section class="pane" id="pane-upcoming">
    <div class="upcoming" id="upcoming"></div>
  </section>

</div>

<!-- 移动端底部导航 -->
<nav class="bottomnav">
  <button class="active" data-pane="sites">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    网站
  </button>
  <button data-pane="board">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>
    优先级
  </button>
  <button data-pane="upcoming">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    近期
  </button>
</nav>

<!-- 模态框：新建/编辑工作 -->
<div class="modal-mask" id="taskModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="taskModalTitle">新建工作内容</h3>
      <button class="close" data-close>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field" id="tplFieldWrap">
        <label>从模板填充（可选）</label>
        <select id="fTemplate">
          <option value="">— 不使用模板，手动填写 —</option>
        </select>
      </div>
      <div class="field">
        <label>所属网站</label>
        <select id="fWebsite"></select>
      </div>
      <div class="field">
        <label>工作标题</label>
        <input type="text" id="fTitle" placeholder="例如：Q3产品页更新" maxlength="80">
      </div>
      <div class="field">
        <label>优先级</label>
        <div class="seg" id="fPriority">
          <button class="seg-opt" data-p="P0"><span class="d" style="background:var(--p0)"></span>P0 紧急</button>
          <button class="seg-opt active" data-p="P1"><span class="d" style="background:var(--p1)"></span>P1 重要</button>
          <button class="seg-opt" data-p="P2"><span class="d" style="background:var(--p2)"></span>P2 一般</button>
        </div>
      </div>
      <div class="field">
        <label>截止日期</label>
        <input type="date" id="fDue">
      </div>
      <div class="field">
        <label>步骤（每个可单独设日期 / 可跳过）</label>
        <div id="fStepsList" style="display:flex;flex-direction:column;gap:8px"></div>
        <button type="button" class="btn" id="fStepAdd" style="margin-top:8px;align-self:flex-start;padding:6px 12px;font-size:13px">+ 添加步骤</button>
      </div>
      <div class="field">
        <label>备注（可选）</label>
        <textarea id="fNote" placeholder="额外说明…" style="min-height:50px"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn btn-primary" id="taskSave">保存</button>
    </div>
  </div>
</div>

<!-- 快速处理弹窗 -->
<div class="modal-mask" id="quickModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-head">
      <h3 id="quickTitle">处理任务</h3>
      <button class="close" data-close>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="quick-meta" id="quickMeta" style="font-size:13px;color:var(--ink-2);margin-bottom:8px"></div>
      <div id="quickSteps" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="quick-actions" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:center">
        <button type="button" class="bb-mini" id="quickCheckAll">✓ 全勾</button>
        <button type="button" class="bb-mini" id="quickUncheckAll">✗ 全取消</button>
      </div>
    </div>
    <div class="modal-foot">

const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return fmt(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
function relDue(dueStr) {
  if(!dueStr) return {label:'', cls:''};
  const n = daysBetween(todayStr(), dueStr);
  if(n < 0) return {label:'已逾期'+(-n)+'天', cls:'over'};
  if(n===0) return {label:'今天到期', cls:'today'};
  if(n===1) return {label:'明天到期', cls:'soon'};
  if(n<=3) return {label:n+'天后到期', cls:'soon'};
  return {label:n+'天后', cls:''};
}
function load(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function shiftDate(str, n) {
  const [y,m,d] = str.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const dd = String(dt.getDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}
function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); if(!suppressSync && (k===K_WEBSITES||k===K_TASKS||k===K_TEMPLATES)) schedulePush(); }

  // 增量合并：保留用户自建模板，预置模板用最新定义覆盖
  // 同时清除历史版本残留的旧预置模板名（v2 的 6 个旧名字）
  const LEGACY_PRESET_NAMES = new Set([
    '建站标准流程','产品页上新','博客文章发布','支付通道接入','404死链检测','文章信息增量注入'
  ]);
  const presetNames = new Set(presets.map(p=>p.name));
  const userOwned = load(K_TEMPLATES, []).filter(t => 
    !presetNames.has(t.name) && !LEGACY_PRESET_NAMES.has(t.name)
  );
  save(K_TEMPLATES, userOwned.concat(presets));
  localStorage.setItem(PREFIX + 'tpl_version', TPL_VERSION);
  return true;
}

/* ---------- 渲染：今日要处理 ---------- */
function renderToday() {
  const t = todayStr();
  const wsMap = {}; websites.forEach(w=>wsMap[w.id]=w);
  // 混合模式（任务级粒度）：
  // 1. task.due 在 ≤3 天 → 列出整个任务
  // 2. step.due 在 ≤3 天，且 task.due 不在范围内 → 也列出整个任务（去重）
  const taskMap = new Map();
  tasks.forEach(task => {
    if(allDone(task)) return;
    const taskDueIn = task.due ? daysBetween(t, task.due) : 9999;
    const taskInRange = taskDueIn <= 3;
    if(taskInRange){ taskMap.set(task.id, { task, due: task.due, dueSource: 'task' }); return; }
    // 任务整体不在范围，但步骤可能单独到期
    const stepInRange = task.steps.some(s => !s.done && s.due && daysBetween(t, s.due) <= 3);
    if(stepInRange) taskMap.set(task.id, { task, due: task.due || '', dueSource: 'step' });
  });
  const items = [...taskMap.values()];
  items.sort((a,b) => {
    const ao = (a.due && daysBetween(t, a.due) < 0) ? 0 : 1;
    const bo = (b.due && daysBetween(t, b.due) < 0) ? 0 : 1;
    if(ao !== bo) return ao - bo;
    const pr = {P0:0, P1:1, P2:2};
    if(pr[a.task.priority] !== pr[b.task.priority]) return pr[a.task.priority] - pr[b.task.priority];
    return (a.due||'9999').localeCompare(b.due||'9999');
  });
  const over = items.filter(x => x.due && daysBetween(t, x.due) < 0).length;
  const todayN = items.filter(x => x.due && daysBetween(t, x.due) === 0).length;
  const soon = items.filter(x => x.due && daysBetween(t, x.due) > 0).length;

  let html = `
    <div class="today-head">
      <h2>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--brand-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        今天要处理
      </h2>
      <span class="date">${formatChineseDate(t)}</span>
      <span class="today-count">
        ${over?`<span class="pill pill-over">逾期 ${over}</span>`:''}
        ${todayN?`<span class="pill pill-today">今日 ${todayN}</span>`:''}
        ${soon?`<span class="pill pill-soon">近3天 ${soon}</span>`:''}
      </span>
    </div>`;

  if(!items.length) {
    html += `<div class="today-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      棒！近期没有逾期或紧急的工作，可以去看看全部工作内容。
    </div>`;
  } else {
    html += '<div class="today-list">';
    items.forEach(({ task, due }) => {
      const ws = wsMap[task.websiteId];
      const r = due ? relDue(due) : { cls: '', label: '无截止' };
      const prog = taskProgress(task);
      const over = due && daysBetween(t, due) < 0;
      const expanded = expandedTasks.has(task.id);
      html += `
        <div class="today-task ${over?'over':''} ${expanded?'expanded':''}" data-task="${task.id}">
          <div class="tt-row" data-toggle-task="${task.id}">
            <span class="tt-expand">${expanded?'▼':'▶'}</span>
            <div class="pmark" style="background:${PCOLOR[task.priority]}"></div>
            <span class="tt-title">${escapeHtml(task.title)}</span>
            <span class="tt-meta">
              ${ws?`<span class="ws">${escapeHtml(ws.domain||ws.name)}</span>`:''}
              <span>${prog.done}/${prog.total}</span>
            </span>
            <span class="due ${r.cls}">${r.label}</span>
          </div>
          <button class="icon-btn" data-edit-task="${task.id}" title="编辑">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          </button>
          <div class="tt-steps" ${expanded?'':'hidden'}>
            ${sortStepsForDisplay(task.steps).map(s => renderTodayStep(s, task.id)).join('') || '<div style="padding:8px;color:var(--ink-3);font-size:13px">无步骤</div>'}
          </div>
        </div>`;
    });
    html += '</div>';
  }
  $('#todayBox').innerHTML = html;
}

/* 步骤排序：未完成在前(原序) + 已完成在后(原序) */
function sortStepsForDisplay(steps){
  return [...steps].sort((a, b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    return 0;
  });
}

}

function renderTaskGrid() {
  const w = websites.find(x=>x.id===activeWs);
  if(!w) { $('#taskGrid').innerHTML = emptyState('网站','还没有网站，点右上角「新建网站」开始'); return; }
  let wsTasks = tasks.filter(t=>t.websiteId===w.id);
  // 排序：未完成在前，按优先级再按截止日期
  const pr = {P0:0,P1:1,P2:2};
  wsTasks.sort((a,b)=>{
    const ad=allDone(a)?1:0, bd=allDone(b)?1:0;
    if(ad!==bd) return ad-bd;
    if(pr[a.priority]!==pr[b.priority]) return pr[a.priority]-pr[b.priority];
    return (a.due||'9999').localeCompare(b.due||'9999');
  });
  // 隐藏已完成：过滤掉 allDone
  if(!$('#showDone').checked){
    wsTasks = wsTasks.filter(t => !allDone(t));
  }
  if(!wsTasks.length) {
    const msg = $('#showDone').checked
      ? '这个网站还没有任何工作内容，去新建一个吧'
      : '这个网站还没有未完成的工作内容，点右上角「新建工作」添加';
    $('#taskGrid').innerHTML = emptyState('工作', msg);
    return;
  }
  $('#taskGrid').innerHTML = wsTasks.map(renderTaskCard).join('');
  bindStepEvents();
}

/* ---------- 批量编辑 ---------- */
function renderBatchBar() {
  const bar = $('#batchBar');
  const n = selectedTasks.size;
  $('#bbCount').textContent = '已选 ' + n + ' 项';
  bar.classList.toggle('show', n > 0);
  // 注：#bbWebsite 在动态 panel 里，只在面板展开时填充
}
function clearSelection() {
  selectedTasks.clear();
  document.body.classList.remove('batch-mode');
  renderBatchBar();
  // 重渲染卡片（图标变回未选中状态）
  if($('#taskGrid')) renderTaskGrid();
}
function selectAllVisible() {
  const w = websites.find(x=>x.id===activeWs);
  if(!w) return;
  tasks.filter(t=>t.websiteId===w.id).forEach(t => selectedTasks.add(t.id));
  document.body.classList.add('batch-mode');
  renderTaskGrid(); renderBatchBar();
}
function batchSetPriority(p) {
  if(!selectedTasks.size) return;
  let c = 0;
  tasks.forEach(t => { if(selectedTasks.has(t.id)) { t.priority = p; c++; } });
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已将 '+c+' 项优先级设为 '+p, 'ok');
}
function batchShiftDue(n) {
  if(!selectedTasks.size) return;
  const t = todayStr();
  let c = 0;
  tasks.forEach(x => {
    if(!selectedTasks.has(x.id)) return;
    if(x.due) { x.due = shiftDate(x.due, n); }
    else { x.due = shiftDate(t, n); }
    c++;
  });
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已顺延 '+n+' 天（'+c+' 项）', 'ok');
}
function batchSetDate(dateStr) {
  if(!selectedTasks.size || !dateStr) return;
  let c = 0;
  tasks.forEach(x => { if(selectedTasks.has(x.id)) { x.due = dateStr; c++; } });
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已设日期 '+dateStr+'（'+c+' 项）', 'ok');
}
/* 批量按步骤排期：每个选中任务，从起始日开始按间隔天数给每个步骤分配 due
   示例：起始日 8/5，间隔 1 天，3 步任务 → 步骤1=8/5，步骤2=8/6，步骤3=8/7
   task.due 不变（用户可单独设），只改 step.due */
function batchStepSchedule(startStr, gapDays) {
  if(!selectedTasks.size || !startStr) { toast('请填起始日和间隔','err'); return; }
  let c = 0;
  tasks.forEach(x => {
    if(!selectedTasks.has(x.id)) return;
    if(!x.steps || !x.steps.length) return;
    x.steps.forEach((s, i) => { s.due = shiftDate(startStr, i * gapDays); });
    c++;
  });
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已排期 '+c+' 项任务的步骤（起始 '+startStr+'，间隔 '+gapDays+' 天）','ok');
}
function batchMoveWebsite(wid) {
  if(!selectedTasks.size || !wid) return;
  let c = 0;
  tasks.forEach(x => { if(selectedTasks.has(x.id)) { x.websiteId = wid; c++; } });
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已移动 '+c+' 项到 '+ (websites.find(w=>w.id===wid)?.domain||'网站'), 'ok');
}
/* 批量复制：复制选中任务到目标网站，新 id + 新 createdAt，步骤也重置 id 但保留 done 状态 */
function batchCopyWebsite(wid) {
  if(!selectedTasks.size || !wid) return;
  let c = 0;
  const copies = [];
  tasks.forEach(x => { 
    if(selectedTasks.has(x.id)){ 
      copies.push({
        ...x,
        id: uid(),
        websiteId: wid,
        createdAt: todayStr(),
        steps: x.steps.map(s => ({...s, id: uid()})) // 步骤 id 重置
      });
      c++;
    }
  });
  tasks.push(...copies);
  save(K_TASKS, tasks);
  clearSelection(); renderAll();
  toast('已复制 '+c+' 项到 '+ (websites.find(w=>w.id===wid)?.domain||'网站'), 'ok');
}
function batchDeleteSelected() {
  if(!selectedTasks.size) return;
  const n = selectedTasks.size;
  showConfirm('删除选中的 '+n+' 项工作？', '这 '+n+' 项工作及其所有步骤将被永久删除，此操作不可恢复。', () => {
    tasks = tasks.filter(t => !selectedTasks.has(t.id));
    save(K_TASKS, tasks);
    clearSelection(); renderAll();
    toast('已删除 '+n+' 项工作','ok');
  });
}

    return (a.due||'9999').localeCompare(b.due||'9999');

  $('#board').innerHTML = ['P0','P1','P2'].map(p => `
    <div class="board-col">
      <div class="board-col-head">

        ${cols[p].length ? cols[p].map(t=>miniCard(t,wsMap)).join('') : '<div style="text-align:center;color:var(--ink-3);font-size:13px;padding:20px 0">暂无</div>'}
      </div>
    </div>`).join('');
}
function miniCard(t, wsMap){
  const ws = wsMap[t.websiteId];
  const prog = taskProgress(t);
  const r = relDue(t.due);
  return `<div class="mini-card ${allDone(t)?'done':''}" style="border-color:${PCOLOR[t.priority]}" data-edit="${t.id}">
    <div class="mc-title">${escapeHtml(t.title)}</div>
    <div class="mc-meta">
      <span class="ws">${ws?escapeHtml(ws.domain||ws.name):'未分类'}</span>
      ${t.due?`<span class="${r.cls}" style="font-weight:600;color:${r.cls==='over'?'var(--p0)':r.cls==='today'?'#92400E':'var(--brand-d)'}">${r.label}</span>`:''}
    </div>
    <div class="mc-prog">
      <div class="bar"><div class="fill" style="width:${prog.pct}%;background:${PCOLOR[t.priority]}"></div></div>
      <span class="num">${prog.done}/${prog.total}</span>
    </div>
  </div>`;
}

/* ---------- 渲染：近期工作 ---------- */
function renderUpcoming() {
  const wsMap = {}; websites.forEach(w=>wsMap[w.id]=w);
  const t = todayStr();
  // 收集"步骤项"——按日期分组，每个步骤归到它的到期日
  // 1. task.due 到期 → 该任务所有步骤（含已完成，用于划掉显示）归到 task.due
  // 2. step.due 到期且 step.due != task.due → 该步骤归到 step.due
  const items = [];
  const seenKeys = new Set();
  tasks.forEach(task => {
    if(allDone(task)) return;
    const taskDueIn = task.due ? daysBetween(t, task.due) : 9999;
    const taskInRange = (taskDueIn <= 7 && taskDueIn >= 0) || taskDueIn < 0;
    if(taskInRange && task.due){
      task.steps.forEach(s => {
        const key = s.id + '|' + task.due;
        if(seenKeys.has(key)) return;
        items.push({ task, step: s, date: task.due, dueSource: 'task' });
        seenKeys.add(key);
      });
    }
    task.steps.forEach(s => {
      if(!s.due) return;
      if(s.due === task.due && taskInRange) return;
      const sd = daysBetween(t, s.due);
      if(sd > 7 && sd >= 0) return;
      const key = s.id + '|' + s.due;
      if(seenKeys.has(key)) return;
      items.push({ task, step: s, date: s.due, dueSource: 'step' });
      seenKeys.add(key);
    });
  });
  const groups = {};
  const overdue = [];
  items.forEach(it => {
    const n = daysBetween(t, it.date);
    if(n < 0) overdue.push(it);
    else (groups[it.date] = groups[it.date] || []).push(it);
  });
  const pr = {P0:0, P1:1, P2:2};
  function sortGroup(arr){
    arr.sort((a,b) => {
      if(pr[a.task.priority] !== pr[b.task.priority]) return pr[a.task.priority] - pr[b.task.priority];
      if(a.step.done !== b.step.done) return a.step.done ? 1 : -1;
      return 0;
    });
    return arr;
  }
  sortGroup(overdue);
  Object.values(groups).forEach(sortGroup);

  if(!items.length) {
    $('#upcoming').innerHTML = emptyState('近期', '未来7天没有安排工作，去新建一个吧');
    return;
  }
  let html = '';
  if(overdue.length) {
    html += '<div class="day-group"><div class="day-head" style="background:var(--p0-bg)"><div class="dnum" style="color:var(--p0)">!</div><div class="dinfo" style="color:var(--p0)"><div>已逾期 · 需尽快处理</div><div class="dweek">' + overdue.length + ' 个步骤</div></div><span class="dcnt" style="background:var(--p0);color:#fff;border-color:var(--p0)">' + overdue.length + '</span></div><div class="day-body">' + renderDayBody(overdue, wsMap) + '</div></div>';
  }
  for(let i=0; i<=7; i++){
    const d = addDays(t, i);
    if(!groups[d]) continue;
    const date = parse(d);
    const week = ['日','一','二','三','四','五','六'][date.getDay()];
    html += '<div class="day-group"><div class="day-head ' + (i===0?'today':'') + '"><div class="dnum">' + date.getDate() + '</div><div class="dinfo"><div>' + (i===0?'今天':i===1?'明天':formatChineseDate(d)) + '</div><div class="dweek">周' + week + ' · ' + groups[d].length + ' 步</div></div><span class="dcnt">' + groups[d].length + '</span></div><div class="day-body">' + renderDayBody(groups[d], wsMap) + '</div></div>';
  }
  $('#upcoming').innerHTML = html;
}
function renderDayBody(items, wsMap){
  const byTask = {};
  items.forEach(it => { (byTask[it.task.id] = byTask[it.task.id] || []).push(it); });
  let html = '';
  Object.keys(byTask).forEach(tid => {
    const taskItems = byTask[tid];
    const task = taskItems[0].task;
    const ws = wsMap[task.websiteId];
    html += '<div class="up-task"><div class="up-task-head"><div class="pmark" style="background:' + PCOLOR[task.priority] + '"></div><span class="up-task-title">' + escapeHtml(task.title) + '</span>' + (ws?'<span class="up-ws">' + escapeHtml(ws.domain||ws.name) + '</span>':'') + '</div><div class="up-task-steps">' + taskItems.map(it => renderUpStep(it)).join('') + '</div></div>';
  });
  return html;
}
function renderUpStep(it){
  const { task, step } = it;
  return '<div class="up-step ' + (step.done?'done':'') + '" data-step-toggle="' + step.id + '" data-step-task="' + task.id + '"><div class="up-step-check ' + (step.done?'checked':'') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><span class="up-step-name">' + escapeHtml(step.name) + '</span>' + (step.skippable?'<span class="step-skip">可跳过</span>':'') + '</div>';
}

/* ---------- 辅助 ---------- */
function taskProgress(x){
  const total = x.steps.length;
  const done = x.steps.filter(s=>s.done).length;
  return { done, total, pct: total?Math.round(done/total*100):0 };
}
function allDone(x){ const p=taskProgress(x); return p.total>0 && p.done===p.total; }
function formatChineseDate(s){
  const d=parse(s); return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function formatShort(s){
  const d=parse(s); return (d.getMonth()+1)+'/'+d.getDate();
}
function emptyState(icon, msg){
  const icons = {
    '网站': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    '工作': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    '近期': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  };
  return `<div class="empty-state">${icons[icon]||icons['工作']}<h4>暂无内容</h4><p>${msg}</p></div>`;
}

/* ---------- 事件绑定 ---------- */
function bindStepEvents(){
  // 步骤勾选
  $$('.step[data-step]').forEach(el => {
    el.addEventListener('click', e => {
      if(e.target.closest('[data-del-step]')) return;
      const sid = el.dataset.step, tid = el.dataset.task;
      const t = tasks.find(x=>x.id===tid);
      if(!t) return;
      const s = t.steps.find(y=>y.id===sid);
      if(!s) return;
      s.done = !s.done;
      save(K_TASKS, tasks);
      // 局部更新这张卡片
      const card = el.closest('.task-card');
      const x = tasks.find(y=>y.id===tid);
      const prog = taskProgress(x);
      card.classList.toggle('done', allDone(x));
      card.querySelector('.tc-progress .fill').style.width = prog.pct+'%';
      card.querySelector('.tc-progress .fill').style.background = allDone(x)?'var(--ok)':PCOLOR[x.priority];
      card.querySelector('.tc-progress .num').textContent = prog.done+'/'+prog.total;
      el.classList.toggle('done', s.done);
      renderToday(); renderBoard(); renderUpcoming(); renderWsTabs(); renderWsHead();
    });
  });
  // 删除步骤
  $$('[data-del-step]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const sid = el.dataset.delStep, tid = el.dataset.delTask;
      const t = tasks.find(x=>x.id===tid);
      if(!t) return;
      t.steps = t.steps.filter(s=>s.id!==sid);
      save(K_TASKS, tasks);
      renderAll();
      toast('已删除步骤','ok');
    });
  });
  // 添加步骤
  $$('.step-add').forEach(el => {
    const inp = el.querySelector('input[type=text]');
    const chk = el.querySelector('input[type=checkbox]');
    const btn = el.querySelector('button');
    const tid = el.dataset.addFor;
    const doAdd = () => {
      const v = inp.value.trim();
      if(!v) return;
      const t = tasks.find(x=>x.id===tid);
      if(!t) return;
      t.steps.push({ id:uid(), name:v, done:false, skippable:chk.checked });
      save(K_TASKS, tasks);
      renderAll();
      inp.value=''; chk.checked=false;
    };
    btn.addEventListener('click', doAdd);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
  });
}

// onAll 把每个 el 包进箭头函数，保证 fn 收到的是 DOM 元素而非 Event
function on(el, ev, fn){
  if(el) el.addEventListener(ev, fn);
}
function onAll(els, ev, fn){
  if(!els) return;
  els.forEach(el => el.addEventListener(ev, (e) => fn(el, e)));
}

/* 批量导入模板：JSON 格式支持两种
   1) 直接是模板数组：[ {id, name, title, priority, steps:[...]} ]
   2) 整个 data.json：{version, websites, tasks, templates:[...]} —— 抽出 templates
   导入策略：跳过 LEGACY 黑名单名字，其余追加到 templates 末尾 */
function importTemplatesBatch(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      let raw = JSON.parse(reader.result);
      let incoming = Array.isArray(raw) ? raw : (raw.templates || []);
      if(!incoming.length) throw new Error('JSON 里没有找到模板数组');
      const LEGACY = new Set(['建站标准流程','产品页上新','博客文章发布','支付通道接入','404死链检测','文章信息增量注入']);
      const existNames = new Set(templates.map(t => t.name));
      const added = [];
      const skipped = [];
      incoming.forEach(t => {
        if(!t || !t.name) { skipped.push('（无名字的条目）'); return; }
        if(LEGACY.has(t.name)) { skipped.push(t.name); return; }
        if(existNames.has(t.name)) { skipped.push(t.name + '（已存在）'); return; }
        // 给缺失字段兜底
        const tpl = {
          id: t.id || uid(),
          name: t.name,
          title: t.title || t.name,
          priority: t.priority || 'P2',
          steps: Array.isArray(t.steps) ? t.steps.map(s => ({
            id: s.id || uid(),
            name: s.name || '步骤',
            skippable: !!s.skippable
          })) : []
        };
        templates.push(tpl);
        added.push(tpl.name);
        existNames.add(tpl.name);
      });
      save(K_TEMPLATES, templates);
      renderTplLib && renderTplLib();
      const msg = `导入完成：新增 ${added.length} 个${skipped.length?'，跳过 '+skipped.length+' 个（'+skipped.slice(0,3).join('、')+(skipped.length>3?'…':'')+'）':''}`;
      toast(msg, added.length ? 'ok' : 'err');
    } catch(err){
      toast('导入失败：'+err.message, 'err');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function saveQuickHandle(){

function saveTask(){
  if(!websites.length){ toast('请先新建网站','err'); return; }
  const websiteId = $('#fWebsite').value;
  const title = $('#fTitle').value.trim();
  if(!title){ toast('请填写工作标题','err'); return; }
  const priority = $('#fPriority .seg-opt.active').dataset.p;
  const due = $('#fDue').value || '';
  const note = $('#fNote').value.trim();
  const steps = readFormSteps();
  if(!steps.length){ toast('至少需要一个步骤','err'); return; }
  if(editingTaskId){
    const t = tasks.find(x=>x.id===editingTaskId);
    // 保留已存在步骤的done状态（按名称匹配）
    const oldMap = {}; t.steps.forEach(s=>oldMap[s.name]=s);
    const newSteps = steps.map(s => {
      const old = oldMap[s.name];
      if(old) return { ...s, id:old.id, done:old.done };
      return s;
    });
    t.websiteId = websiteId; t.title=title; t.priority=priority; t.due=due; t.note=note; t.steps=newSteps;
    toast('已更新','ok');
  } else {
    tasks.push({ id:uid(), websiteId, title, priority, due, steps, note, createdAt:todayStr() });
    toast('已新建','ok');
  }
  save(K_TASKS, tasks);
  activeWs = websiteId; save(K_ACTIVE_WS, activeWs);
  closeAllModals();
  renderAll();
}

function saveWs(){
  const name = $('#wsName').value.trim();
  const domain = $('#wsDomain').value.trim();
  if(!name){ toast('请填写网站名称','err'); return; }
  if(!domain){ toast('请填写域名（如 example.com）','err'); return; }
  const colorBtn = $('#wsColor .seg-opt.active');
  const color = colorBtn ? colorBtn.dataset.c : WS_COLORS[0];
  if(editingWsId){
    const w = websites.find(x => x.id === editingWsId);
    if(w){ w.name = name; w.domain = domain; w.color = color; }
    save(K_WEBSITES, websites);
    toast('已更新网站','ok');
  } else {
    // 同名检测：如果有同名隐藏网站，提示恢复
    const sameDomain = websites.find(w => w.domain === domain && w.hidden);
    if(sameDomain){
      showConfirm('已有同名网站「'+sameDomain.name+'」已隐藏', '是否恢复显示这个隐藏的网站？选「确认」恢复，选「取消」继续新建。', () => {
        sameDomain.hidden = false;
        sameDomain.name = name; // 用新名称覆盖
        sameDomain.color = color;
        save(K_WEBSITES, websites);
        activeWs = sameDomain.id; save(K_ACTIVE_WS, activeWs);
        editingWsId = null;
        closeAllModals();
        renderAll();
        toast('已恢复网站','ok');
      });
      return; // 不新建，等用户决定
    }
    const w = { id:uid(), name, domain, color, hidden:false };
    websites.push(w);
    activeWs = w.id; save(K_ACTIVE_WS, activeWs);
    save(K_WEBSITES, websites);
    toast('已新建网站','ok');
  }
  editingWsId = null;
  closeAllModals();
  renderAll();
}
function confirmDelWs(){

    : '此操作不可恢复。';
  showConfirm('删除网站「'+w.name+'」？', txt, () => {
    websites = websites.filter(x => x.id !== w.id);
    tasks = tasks.filter(t => t.websiteId !== w.id);
    selectedTasks = new Set([...selectedTasks].filter(id => tasks.some(t => t.id === id)));
    if(activeWs === w.id) activeWs = websites[0]?.id || null;
    save(K_WEBSITES, websites);
    save(K_TASKS, tasks);
    save(K_ACTIVE_WS, activeWs);
    editingWsId = null;
    closeAllModals();
    renderAll();
    toast('已删除网站','ok');
  });
}
function confirmHideWs(){
  const w = websites.find(x => x.id === editingWsId);

  w.hidden = true;
  save(K_WEBSITES, websites);
  if(activeWs === w.id) activeWs = websites.filter(x => !x.hidden)[0]?.id || null;

  editingWsId = null;

  } else {

    html += '<div style="font-size:13px;font-weight:600;color:var(--ink-2);margin:14px 0 8px">显示中（'+visible.length+'）</div>';
    visible.forEach(w => {
      const n = tasks.filter(t => t.websiteId === w.id).length;
      html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px"><span class="dot" style="width:10px;height:10px;border-radius:3px;background:'+w.color+';flex-shrink:0"></span><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">'+escapeHtml(w.domain||w.name)+'</div><div style="font-size:11px;color:var(--ink-3)">'+escapeHtml(w.name)+' · '+n+' 项任务</div></div><button class="bb-mini" data-hide-ws="'+w.id+'">隐藏</button></div>';

/* ---------- 确认弹窗 ---------- */
let confirmCb = null;
function showConfirm(title, text, cb){
  $('#confirmTitle').textContent = title;
  $('#confirmText').textContent = text;
  confirmCb = cb;
  $('#confirmModal').classList.add('show');
}
$('#confirmOk').addEventListener('click', () => {
  const cb = confirmCb; confirmCb = null;
  $('#confirmModal').classList.remove('show');  // 只关确认框,保留底层弹窗(如模板库)
  if(cb) cb();
});
$('#confirmCancel').addEventListener('click', () => {
  $('#confirmModal').classList.remove('show');
  confirmCb = null;
});

function closeAllModals(){ $$('.modal-mask').forEach(m=>m.classList.remove('show')); }

/* ---------- 导出/导入 ---------- */
function exportData(){
  const data = { version:1, exportedAt:new Date().toISOString(), websites, tasks, templates };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '多站工作进度_备份_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 '+websites.length+' 网站 / '+tasks.length+' 工作 / '+templates.length+' 模板','ok');
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if(!data.websites || !data.tasks) throw new Error('格式不对');
      const tplN = (data.templates||[]).length;
      showConfirm('确认导入？', `将覆盖当前数据（${websites.length}网站/${tasks.length}工作/${templates.length}模板），导入 ${data.websites.length} 网站 / ${data.tasks.length} 工作 / ${tplN} 模板。建议先导出当前备份。`, () => {
        websites = data.websites; tasks = data.tasks;
        templates = data.templates || [];
        save(K_WEBSITES, websites); save(K_TASKS, tasks); save(K_TEMPLATES, templates);
        activeWs = websites[0]?.id || null; save(K_ACTIVE_WS, activeWs);
        localStorage.setItem(K_SAMPLE, SAMPLE_VERSION);
        localStorage.setItem(PREFIX + 'tpl_version', TPL_VERSION);
        renderAll();
        toast('导入成功','ok');
      });
    } catch(err){ toast('导入失败：'+err.message,'err'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------- GitHub 云端同步 ---------- */
function b64encodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decodeUtf8(b64){ return decodeURIComponent(escape(atob(b64.replace(/\s/g,'')))); }

function syncApiUrl(){
  return 'https://api.github.com/repos/'+encodeURIComponent(syncCfg.owner)+'/'+encodeURIComponent(syncCfg.repo)+'/contents/'+encodeURIComponent(syncCfg.path);
}
function ghHeaders(extra){
  return Object.assign({ 'Authorization':'Bearer '+syncCfg.token, 'Accept':'application/vnd.github+json' }, extra||{});
}
function updateSyncStatus(state, msg){
  syncMeta.status = state; syncMeta.msg = msg||'';
  if(state==='ok') syncMeta.lastSync = Date.now();
  save(K_SYNC_META, syncMeta);
  const el = $('#syncStatus');
  if(!el) return;
  const map = {
    idle:  ['idle','未配置 / 已断开'],
    doing: ['doing','同步中…'],
    ok:    ['ok','已连接 · 上次同步 '+(syncMeta.lastSync?new Date(syncMeta.lastSync).toLocaleString('zh-CN'):'—')],
    err:   ['err','同步失败：'+(syncMeta.msg||'未知错误')]
  };
  const [cls,txt] = map[state] || map.idle;
  el.className = 'sync-status '+cls;
  el.textContent = txt;
}

async function githubPull(){
  if(!syncCfg || !syncCfg.token) return null;
  const res = await fetch(syncApiUrl(), { headers: ghHeaders() });
  if(res.status === 404) return null; // 远程还没有数据文件
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.message || ('HTTP '+res.status)); }
  const j = await res.json();
  const data = JSON.parse(b64decodeUtf8(j.content));
  data.__sha = j.sha;
  return data;
}

function setRemoteSha(sha){
  remoteSha = sha || null;
  save(K_SYNC_SHA, remoteSha);
}

async function githubPush(){
  if(!syncCfg || !syncCfg.token) return;
  if(syncPushTimer) return; // 已在排队

  // 防御：如果 memory/localStorage 都没 sha（比如首次、或被清），先 pull 一次拿
  if(!remoteSha){
    try {
      const data = await githubPull();
      if(data) applyRemote(data);
    } catch(_){ /* pull 失败也照试 push，让 GitHub 报错 */ }
  }

  const payload = { version:2, exportedAt:new Date().toISOString(), websites, tasks, templates };
  const body = { message:'sync: '+new Date().toISOString(), content: b64encodeUtf8(JSON.stringify(payload)) };
  if(remoteSha) body.sha = remoteSha;
  const res = await fetch(syncApiUrl(), { method:'PUT', headers: ghHeaders({'Content-Type':'application/json'}), body: JSON.stringify(body) });
  if(!res.ok){
    if(res.status===409) throw new Error('CONFLICT');
    if(res.status===422 && remoteSha){
      // sha 失效（被外部改了），清掉再重试一次
      try{ const e = await res.json(); if((e.errors||[]).some(x=>/sha/i.test(x.message||''))) throw new Error('SHA_INVALID'); }catch(_){ throw new Error('HTTP 422'); }
    }
    const e = await res.json().catch(()=>({})); throw new Error(e.message || ('HTTP '+res.status));
  }
  const j = await res.json();
  remoteSha = j.content.sha;
  save(K_SYNC_SHA, remoteSha);
}

function schedulePush(){
  if(!syncCfg || !syncCfg.token) return;
  if(syncPushTimer) clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(async () => {
    syncPushTimer = null;
    try { updateSyncStatus('doing'); await githubPush(); updateSyncStatus('ok'); }
    catch(err){
      if(err.message==='CONFLICT'){ updateSyncStatus('err','远程已被改动'); toast('云端有更新，请点「立即拉取」','err'); }
      else { updateSyncStatus('err', err.message); toast('自动同步失败：'+err.message,'err'); }
    }
  }, 2500);
}

function applyRemote(data){
  if(!data) return;
  suppressSync = true;
  if(Array.isArray(data.websites)){ websites = data.websites; save(K_WEBSITES, websites); }
  if(Array.isArray(data.tasks)){ tasks = data.tasks; save(K_TASKS, tasks); }
  if(Array.isArray(data.templates)){ templates = data.templates; save(K_TEMPLATES, templates); }
  suppressSync = false;
  if(data.__sha) setRemoteSha(data.__sha);
  if(!activeWs || !websites.find(w=>w.id===activeWs)) activeWs = websites[0]?.id || null;
  save(K_ACTIVE_WS, activeWs);
  renderAll();
}

async function doPull(showToast){
  if(!syncCfg || !syncCfg.token){ toast('请先配置同步','err'); return; }
  try {
    updateSyncStatus('doing');
    const data = await githubPull();
    if(!data){ updateSyncStatus('ok'); if(showToast) toast('云端暂无数据，将以本地为准','ok'); return; }
    applyRemote(data);
    updateSyncStatus('ok');
    if(showToast) toast('已从云端拉取最新数据','ok');
  } catch(err){
    updateSyncStatus('err', err.message);
    toast('拉取失败：'+err.message,'err');
  }
}

function openSyncModal(){
  $('#syncOwner').value = syncCfg?.owner || '';
  $('#syncRepo').value = syncCfg?.repo || '';
  $('#syncPath').value = syncCfg?.path || 'data.json';
  $('#syncToken').value = syncCfg?.token || '';
  updateSyncStatus(syncMeta.status || 'idle', syncMeta.msg);
  $('#syncModal').classList.add('show');
}

function saveSyncCfg(){
  const owner = $('#syncOwner').value.trim();
  const repo = $('#syncRepo').value.trim();
  const path = ($('#syncPath').value.trim()) || 'data.json';
  const token = $('#syncToken').value.trim();
  if(!owner || !repo || !token){ toast('用户名/仓库名/Token 都必须填','err'); return; }
  syncCfg = { owner, repo, path, token };
  save(K_SYNC, syncCfg);
  setRemoteSha(null);
  toast('配置已保存，正在同步…','ok');
  (async () => {
    try {
      updateSyncStatus('doing');
      const data = await githubPull();
      if(data) applyRemote(data);
      await githubPush();
      updateSyncStatus('ok');
      toast('同步成功','ok');
      closeAllModals();
    } catch(err){
      if(err.message==='CONFLICT'){ updateSyncStatus('err','远程已被改动'); toast('云端有更新，请点「立即拉取」','err'); }
      else { updateSyncStatus('err', err.message); toast('同步失败：'+err.message,'err'); }
    }
  })();
}

function disconnectSync(){
  showConfirm('断开云端同步？', '将清除本设备保存的 GitHub 配置（token 会从本设备删除）。云端仓库里的数据文件不会删除。', () => {
    syncCfg = null; save(K_SYNC, null); setRemoteSha(null);
    updateSyncStatus('idle');
    toast('已断开同步','ok');
  });
}

function initAutoSync(){
  if(syncCfg && syncCfg.token){
    // 后台静默拉取：失败也不要阻断渲染
    doPull(false).catch(()=>{});
  }
}

/* ---------- 备份提示 ---------- */
function checkBackupTip(){
  const el = $('#backupTip');
  if(tasks.length >= 30){
    el.classList.add('show');
    $('#backupTipText').textContent = `数据已积累 ${tasks.length} 项工作，建议导出备份以防丢失。`;
  } else {
    el.classList.remove('show');
  }
}
$('#backupTipBtn').addEventListener('click', exportData);

/* ---------- Toast ---------- */
function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = 'toast '+type;
  const icon = type==='ok'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  el.innerHTML = icon + '<span>'+escapeHtml(msg)+'</span>';
  $('#toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateY(-8px)'; setTimeout(()=>el.remove(),250); }, 2200);
}

/* ---------- 启动 ---------- */
suppressSync = true;
seedSampleData();
seedTemplates();
// 关键：seedSampleData 只写 localStorage 不更新全局变量，必须重新 load
websites = load(K_WEBSITES, []);
tasks = load(K_TASKS, []);
templates = load(K_TEMPLATES, []);
activeWs = load(K_ACTIVE_WS, null);
suppressSync = false;
// 每次启动强制清理历史残留的旧预置模板（不依赖 tpl_version 升级）
purgeLegacyTemplates();
// 如果activeWs失效，重置
if(!activeWs || !websites.find(w=>w.id===activeWs)){ activeWs = websites[0]?.id || null; }
bindTabs();
// 任何渲染异常都不让页面全空
try { renderAll(); } catch(err){ console.error('renderAll failed:', err); }
// 关键修复：本地空数据且已配云端 → 先 await 拉一次再渲染（否则刷新后空白）
(async () => {
  if(syncCfg && syncCfg.token){
    if(websites.length === 0 && tasks.length === 0){
      try {
        await doPull(false);
        if(websites.length === 0 && tasks.length === 0){
          $('#taskGrid').innerHTML = '<div style="padding:48px 20px;text-align:center;color:#ef4444;font-size:14px;line-height:1.8">⚠️ 云端拉取后仍无数据。<br>请点右上角「云端同步」检查 Token / 仓库配置是否正确。</div>';
        }
      } catch(e){
        $('#taskGrid').innerHTML = '<div style="padding:48px 20px;text-align:center;color:#ef4444;font-size:14px;line-height:1.8">⚠️ 云端拉取失败：'+e.message+'<br>请点右上角「云端同步」重试。</div>';
      }
    } else {
      doPull(false).catch(()=>{});
    }
  }
})();
